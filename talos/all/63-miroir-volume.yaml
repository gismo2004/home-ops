# Raw (unformatted) partition consumed by miroir's lvmthin pool. "!system_disk"
# selects the second virtual disk; miroir puts the VG + thin pool on it itself.
# Raw volumes can be applied after install, so this is not a one-shot decision.
apiVersion: v1alpha1
kind: RawVolumeConfig
name: miroir
provisioning:
  diskSelector:
    match: "!system_disk"
  minSize: 100GB
  grow: true
---
# Talos 1.14 generates a "secure" EPHEMERAL mount for new clusters; not part of
# this cluster's behaviour, so left out.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
$patch: delete
---
# Weekly fstrim: both Proxmox disks have discard=on, so freed blocks go back
# to the host's ZFS pools. Weekly scrub checks filesystem metadata.
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
---
apiVersion: v1alpha1
kind: FilesystemScrubConfig
interval: 168h0m0s
