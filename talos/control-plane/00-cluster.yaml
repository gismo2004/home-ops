# etcd stays in v1alpha1: Talos 1.14 has no separate document for it.
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 10.0.0.0/24
---
# Single node: workloads run on the control plane (was
# cluster.allowSchedulingOnControlPlanes).
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - "127.0.0.1"
  - "10.0.0.120"
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  enable-aggregator-routing: true
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
config:
  profiles:
    - schedulerName: default-scheduler
      pluginConfig:
        - name: PodTopologySpread
          args:
            defaultingType: List
            defaultConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
---
apiVersion: v1alpha1
kind: KubeProxyConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false
---
# Talos 1.14 generates a PodSecurity admission config (enforce: baseline) for
# new clusters; this cluster never had one, and privileged workloads run in
# unlabeled namespaces. Deleting it keeps the API server as it was.
# KubeAuthenticationConfig is kept as generated (anonymous access only to
# /livez, /readyz, /healthz, as onedr0p runs it): deleting it makes Talos pass
# an empty authentication file and kube-apiserver refuses to start
# (2026-10-10 outage).
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
$patch: delete
