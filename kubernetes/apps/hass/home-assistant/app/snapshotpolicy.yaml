---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: home-assistant
spec:
  compression:
    compressor: zstd
  mover:
    securityContext:
      # Root, and runAsNonRoot: false is REQUIRED alongside runAsUser: 0 --
      # setting runAsUser alone is a silent no-op on this kopiur version and
      # yields a byte-identical unprivileged Job with no error anywhere.
      # Gated by the privileged-movers annotation on the namespace.
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    cache:
      capacity: 2Gi
      # Ephemeral: a persistent cache keeps the ownership of whichever mover
      # identity last wrote it, breaking the next run under a different one.
      mode: Ephemeral
      storageClassName: miroir-local
  repository:
    kind: ClusterRepository
    name: default
  credentialProjection:
    enabled: true
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: home-assistant-config
  volumeSnapshotClassName: miroir-snap
