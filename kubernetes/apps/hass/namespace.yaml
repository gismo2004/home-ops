---
apiVersion: v1
kind: Namespace
metadata:
  name: hass
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # Lets the home-assistant SnapshotPolicy/Restore movers run as root. Not a
    # convenience: .storage/auth and .storage/http are mode 0600 root-owned and
    # hold every user account, refresh token and http config. An unelevated
    # mover cannot read them, so the backup would either fail outright or --
    # worse -- silently omit exactly the files whose loss forces a full HA
    # re-setup.
    kopiur.home-operations.com/privileged-movers: "true"
