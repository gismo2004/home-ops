---
# Declared as bare Kustomize resources, not app-template's existingClaim
# output and not Helm-templated at all, so no future Helm release can
# ever consider them part of its own release manifest and delete them on
# an uninstall/chart swap.
#
# Each PVC's dataSourceRef claims its own Restore populator in
# restore.yaml — Kopiur fills these from the matching unmonitarr-config /
# unmonitarr-data SnapshotPolicy's most recent snapshot before anything
# else can mount them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unmonitarr-config
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: unmonitarr-config
  resources:
    requests:
      storage: 1Gi
  storageClassName: miroir-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unmonitarr-data
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: unmonitarr-data
  resources:
    requests:
      storage: 10Gi
  storageClassName: miroir-local
