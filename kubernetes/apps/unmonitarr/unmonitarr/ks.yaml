---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unmonitarr
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: unmonitarr
      namespace: unmonitarr
  interval: 1h
  path: ./kubernetes/apps/unmonitarr/unmonitarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: unmonitarr
  wait: true
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
