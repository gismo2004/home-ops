---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mosquitto
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mosquitto
      namespace: mosquitto
  interval: 1h
  path: ./kubernetes/apps/mosquitto/mosquitto/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: mosquitto
  wait: true
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
