---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tasmoadmin
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tasmoadmin
      namespace: tasmoadmin
  interval: 1h
  path: ./kubernetes/apps/tasmoadmin/tasmoadmin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tasmoadmin
  wait: true
