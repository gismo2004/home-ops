---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  values:
    global:
      imageRegistry: mirror.gcr.io
    config:
      envoyGateway:
        # Schaltet die Backend-Erweiterung frei. Ohne das ignoriert der
        # Controller Backend-Objekte, obwohl die CRD vom Chart mitkommt --
        # pve und truenas brauchen sie fuer tls.insecureSkipVerify gegen ihre
        # selbstsignierten Zertifikate (Core Gateway API kann das nicht).
        extensionApis:
          enableBackend: true
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
