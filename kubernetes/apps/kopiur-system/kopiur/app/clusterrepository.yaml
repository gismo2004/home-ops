---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: default
spec:
  # Bucket, endpoint and region are carried over from the old cluster
  # UNCHANGED. Kopiur derives a snapshot's identity from the repository plus
  # <policy>@<namespace>:/pvc/<claim>, so any drift here means the existing
  # snapshots cannot be found and restores silently come back empty.
  allowedNamespaces:
    all: true
  credentialProjection:
    allowed: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: s3.eu-central-003.backblazeb2.com
      region: eu-central-003
      tls:
        disableTls: false
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  scheduleDefaults:
    timezone: Europe/Vienna
    jitter: 6h
  concurrency:
    maxConcurrentJobs: 3
  parameters:
    epoch:
      # Kopia merges index blobs once per epoch, and an epoch cannot close
      # before minDuration. At kopia's 24h default, ~100 backups a day left
      # ~900 blobs right after maintenance and tripped the 1000-blob
      # IndexBlobHealth warning. 6h compacts four times a day.
      minDuration: 6h
