---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    features:
      # Required: every SnapshotPolicy and Restore sets
      # credentialProjection.enabled, and without this the mover Jobs sit
      # Pending forever with MissingCredentialsSecret.
      credentialProjection:
        enabled: true
    monitoring:
      dashboards:
        enabled: false
      prometheusRule:
        enabled: false
      serviceMonitor:
        enabled: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
