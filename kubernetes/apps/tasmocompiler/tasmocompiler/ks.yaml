---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tasmocompiler
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tasmocompiler
      namespace: tasmocompiler
  interval: 1h
  path: ./kubernetes/apps/tasmocompiler/tasmocompiler/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tasmocompiler
  wait: true
