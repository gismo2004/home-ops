---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: miroir
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Chart defaults (128Mi limit) are used everywhere except agent below.
    # 30-day container_memory_working_set_bytes peaks (2026-09-11): controller
    # 57Mi, csi-provisioner 74Mi, csi-resizer 70Mi, csi-snapshotter 61Mi,
    # node-driver-registrar 24Mi — all comfortably under the 128Mi/64Mi
    # chart defaults, no OOMKilled events recorded.
    agent:
      resources:
        limits:
          # Chart default is 128Mi; clean-baseline peak alone is 118Mi (and
          # 165Mi during the stuck-reconcile-loop incident, see
          # github.com/home-operations/miroir/issues/490), too tight to trust
          # the default.
          memory: 256Mi
