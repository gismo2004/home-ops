---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: photoview
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: photoview
      namespace: photoview
  interval: 1h
  path: ./kubernetes/apps/photoview/photoview/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: photoview
  wait: true
  # No kopiur/backup component: photoview has no config PVC. Its state lives
  # entirely in Postgres, the photos are read-only NFS, and the cache PVC is a
  # regenerable thumbnail store the old cluster also never backed up.
