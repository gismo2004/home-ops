---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  chartRef:
    kind: OCIRepository
    name: multus
  interval: 1h
  values:
    # Talos ships no reference CNI plugins; the chart's init container copies
    # macvlan/sbr/static into /opt/cni/bin (cniPlugins.enabled defaults to true).
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
