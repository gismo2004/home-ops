---
# A second interface directly on the home LAN, for pods that need link-local
# traffic the pod network never carries (mDNS discovery of ESPHome nodes).
#
# Addresses are pinned per pod in its annotation and must stay outside both the
# FRITZ!Box DHCP range (10.0.0.10-60) and the Cilium LB pool (10.0.0.130-240).
# In use: 10.0.0.250 home-assistant, 10.0.0.251 esphome.
#
# `sbr` moves the interface's routes into a table used only for traffic sourced
# from the macvlan address. Without it the pod would route all of 10.0.0.0/24 out
# of the macvlan, and a macvlan child cannot reach its own parent host -- which
# answers every LoadBalancer IP (blocky, mosquitto, ...). With it, normal traffic
# keeps using the pod network and only sockets bound to the LAN address use this.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "lan",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0",
          "mode": "bridge",
          "ipam": {
            "type": "static"
          }
        },
        {
          "type": "sbr"
        }
      ]
    }
