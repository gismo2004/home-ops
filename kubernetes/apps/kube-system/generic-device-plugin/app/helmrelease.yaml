---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
spec:
  chartRef:
    kind: OCIRepository
    name: generic-device-plugin
  interval: 1h
  values:
    controllers:
      generic-device-plugin:
        type: daemonset
        strategy: RollingUpdate
        pod:
          priorityClassName: system-node-critical
        containers:
          app:
            image:
              repository: ghcr.io/squat/generic-device-plugin
              tag: 0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
            # One resource per device, requested by exactly one app, so that
            # app gets the node without privileged mode. The plugin itself
            # stays privileged: it has to see /dev, but it has no user-facing
            # service and only hands out what is listed here.
            args:
              - --domain
              - squat.ai
              # OSCam's smartcard reader. /dev/ttyUSB-oscam is the stable
              # udev symlink from talos/all/64-udev.yaml; oscam.server expects
              # the reader at /dev/ttyUSB0.
              - --device
              - |
                name: oscam-reader
                groups:
                  - paths:
                      - path: /dev/ttyUSB-oscam
                        mountPath: /dev/ttyUSB0
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
    persistence:
      device-plugins:
        type: hostPath
        hostPath: /var/lib/kubelet/device-plugins
        globalMounts:
          - path: /var/lib/kubelet/device-plugins
      dev:
        type: hostPath
        hostPath: /dev
        globalMounts:
          - path: /dev
