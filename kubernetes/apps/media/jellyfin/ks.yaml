---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: jellyfin
      namespace: media
  interval: 1h
  path: ./kubernetes/apps/media/jellyfin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: true
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # Identity jellyfin-config@media:/pvc/jellyfin-config, unchanged.
      # NOTE: the media namespace is shared with the arr-suite, so every app
      # here must use its own distinct policy and claim names.
      KOPIUR_NAME: jellyfin-config
      KOPIUR_CLAIM: jellyfin-config
      KOPIUR_CAPACITY: 30Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
