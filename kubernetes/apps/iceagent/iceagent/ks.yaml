---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iceagent
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: iceagent
      namespace: iceagent
  interval: 1h
  path: ./kubernetes/apps/iceagent/iceagent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: iceagent
  wait: true
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      KOPIUR_NAME: iceagent
      KOPIUR_CLAIM: iceagent-config
      KOPIUR_CAPACITY: 1Gi

    substituteFrom:
      - name: cluster-secrets
        kind: Secret
