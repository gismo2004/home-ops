---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pve
spec:
  interval: 1h
  path: ./kubernetes/apps/external-service/pve/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: external-service
  wait: true
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
