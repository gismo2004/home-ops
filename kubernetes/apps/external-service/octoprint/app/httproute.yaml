---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# octoprint spricht reines HTTP (anders als pve/truenas) und zeigt deshalb
# direkt auf die selektorlose Service -- kein Backend, kein TLS-Handling.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: octoprint
spec:
  hostnames:
    - "octoprint.gismo2004.cc"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: octoprint
          port: 5000
