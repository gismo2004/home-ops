---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: octoprint
spec:
  interval: 1h
  path: ./kubernetes/apps/external-service/octoprint/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: external-service
  wait: true
