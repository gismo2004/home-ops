---
# TrueNAS ist HTTPS-only mit selbstsigniertem Zertifikat. Frueher loeste
# nginx das mit `backend-protocol: HTTPS`, was per TLS proxied OHNE das
# Upstream-Zertifikat zu pruefen. Gateway API kann das nur ueber envoy-gateways
# Backend-Erweiterung (insecureSkipVerify), daher zeigt die Route dorthin.
#
# Ohne das antwortet TrueNAS auf plain HTTP mit einem http://-Redirect, der
# endlos auf https:// zurueckspringt -- genau die Schleife, gegen die die
# nginx-Annotation seinerzeit eingebaut wurde.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: truenas
spec:
  # Die Weboberflaeche ist eine Angular-App, die ihre gesamte Kommunikation
  # ueber einen WebSocket auf /websocket abwickelt. Ohne diese Angabe spricht
  # envoy HTTP/2 zum Backend, dort ist `Connection: Upgrade` unzulaessig, und
  # TrueNAS' nginx beantwortet den Upgrade mit 400. Sichtbar wird das nicht als
  # Fehlerseite, sondern als endloses "Connecting to TrueNAS ..." -- die Seite
  # laedt, der Login erscheint nie. Direkt am Geraet liefert derselbe Request
  # 101 Switching Protocols, ueber den Gateway 400.
  appProtocols:
    - gateway.envoyproxy.io/wss
  endpoints:
    - ip:
        address: "10.0.0.2"
        port: 443
  tls:
    insecureSkipVerify: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas
spec:
  hostnames:
    - "truenas.gismo2004.cc"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: truenas
