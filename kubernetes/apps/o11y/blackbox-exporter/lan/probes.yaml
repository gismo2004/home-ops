---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
# Ziele als IPs statt Hostnamen: fuer diese Geraete gibt es keine internen
# DNS-Namen. 10.0.0.40 (octoprint) ist nur waehrend eines Druckauftrags an;
# die Probe zeigt das weiter an, LanProbeFailed nimmt die Adresse aber aus.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-icmp
spec:
  module: icmp
  prober:
    url: blackbox-exporter-lan.o11y.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 10.0.0.1 # FritzBox
        - 10.0.0.2 # truenas
        - 10.0.0.3 # proxmox
        - 10.0.0.40 # octoprint
        - 10.0.0.48 # cluster-cp-1
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-lan
      action: replace
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-nfs
spec:
  jobName: nfs_probe
  module: tcp_connect
  prober:
    url: blackbox-exporter-lan.o11y.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 10.0.0.2:2049
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-lan
      action: replace
