---
# Eigenes Route-Objekt statt route: im Grafana-Subchart -- das bringt keinen
# Gateway-API-Support mit, anders als die Prometheus- und Alertmanager-
# Templates des kube-prometheus-stack selbst.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  hostnames:
    - grafana.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: grafana
          port: 80
