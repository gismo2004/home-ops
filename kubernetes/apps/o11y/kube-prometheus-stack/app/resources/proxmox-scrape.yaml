---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: proxmox-node
  namespace: o11y
spec:
  staticConfigs:
    - targets:
        - 10.0.0.3:9100
      labels:
        instance: proxmox
        node: proxmox
        job: node-exporter
  # The board is an ASUS X99-WS/IPMI, which has an ASPEED BMC. On that board the
  # BMC -- not the nct6791 Super I/O -- owns fan control and fan tach, and most
  # of the Super I/O's remaining inputs are simply not wired to anything. The
  # nct6791 therefore reports a pile of convincing-looking nonsense, which
  # node-exporter faithfully exports (it reads sysfs directly, so an
  # /etc/sensors.d ignore rule on the host would NOT suppress these metrics --
  # it only affects the `sensors` CLI. Dropping has to happen here).
  #
  # Dropped, all from chip platform_nct6775_656:
  #   temp3-temp6   AUXTIN0-3   floating thermistor inputs; AUXTIN1 reads ~79 C
  #                             while measuring nothing at all
  #   temp7-temp12  PCH_*       unpopulated, permanently 0.0 C
  #   fan1-fan6                 permanently 0 RPM -- not wired. Real speeds are
  #                             1500/1500/1200/900/900 RPM via IPMI.
  #   pwm1-pwm6                 drives those same unwired headers
  #   in0-in14 alarms           min==max==0, so every rail alarms permanently
  #   intrusion0/1              spurious ALARM on a chassis that is not open
  #
  # Deliberately KEPT: temp1 (SYSTIN) and temp2 (CPUTIN) are real, and
  # node_hwmon_in_volts still carries usable rail voltages. Authoritative CPU
  # temperature comes from coretemp (chip platform_coretemp_0), which IPMI
  # independently corroborates at 56 C.
  metricRelabelings:
    - sourceLabels: [chip, sensor]
      separator: ";"
      regex: "platform_nct6775_656;(temp([3-9]|1[0-2])|fan[1-6]|pwm[1-6]|intrusion[0-9]+)"
      action: drop
    - sourceLabels: [__name__, chip]
      separator: ";"
      regex: "node_hwmon_in_(alarm|beep_enabled|min_volts|max_volts);platform_nct6775_656"
      action: drop
    # Having dropped the six phantom nct6791 fans above, feed the REAL ones in.
    # The host already exports them: the Debian node-exporter package ships
    # prometheus-node-exporter-ipmitool-sensor.timer, which writes
    # node_ipmi_speed_rpm to the textfile collector every 60s. No extra exporter
    # is needed -- the readings were there all along, just under a metric name
    # no dashboard looks at.
    #
    # node-exporter-full's "Hardware Fan Speed" panel queries:
    #   node_hwmon_fan_rpm * on(chip) group_left(chip_name) node_hwmon_chip_names
    # so a renamed series also needs a `chip` that has a chip_names entry, or the
    # join silently drops it. platform_eeepc_wmi is used because it carries a
    # chip_names entry (chip_name="asus", value 1 -- the join multiplies, so a 0
    # would zero the RPMs) while exposing no sensors of its own, making it a free
    # slot. It also reads more honestly than borrowing platform_nct6775_656:
    # these come from the board's ASPEED BMC, not from the Super I/O.
    #
    # Order matters -- `chip` is set while the metric still has its original
    # name, then the rename happens. Note this consumes node_ipmi_speed_rpm:
    # relabeling renames rather than duplicates, so that name disappears.
    - sourceLabels: [__name__]
      regex: "node_ipmi_speed_rpm"
      targetLabel: chip
      replacement: "platform_eeepc_wmi"
      action: replace
    - sourceLabels: [__name__]
      regex: "node_ipmi_speed_rpm"
      targetLabel: __name__
      replacement: "node_hwmon_fan_rpm"
      action: replace
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: proxmox-smartctl
  namespace: o11y
spec:
  staticConfigs:
    - targets:
        - 10.0.0.3:9633
      labels:
        instance: proxmox
        node: proxmox
        job: smartctl-exporter
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: proxmox-pve
  namespace: o11y
spec:
  metricsPath: /pve
  params:
    target:
      - "10.0.0.3"
  scrapeInterval: 30s
  scrapeTimeout: 20s
  staticConfigs:
    - targets:
        - pve-exporter.o11y.svc.cluster.local:9221
      labels:
        instance: proxmox
        node: proxmox
        job: proxmox-pve
