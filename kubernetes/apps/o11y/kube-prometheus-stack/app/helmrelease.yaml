---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Uebernommen von onedr0p/home-ops (o11y/kube-prometheus-stack), angepasst auf
# diesen Cluster. Abweichungen bewusst:
#
# - storageClassName ceph-block -> miroir-local (WaitForFirstConsumer, fuer
#   StatefulSet-PVCs unproblematisch, weil der Pod den Consumer stellt)
# - Hostnamen *.turbo.ac -> *.gismo2004.cc
# - grafana: statt grafana-operator das im Chart enthaltene Grafana. Die Route
#   dafuer liegt als eigenes HTTPRoute-Objekt daneben, nicht als route: im
#   Subchart -- das Grafana-Subchart bringt keinen Gateway-API-Support mit.
# - kein alertmanagerConfiguration: onedr0ps Variante schickt an Pushover und
#   einen gatus-Heartbeat, beides ueber external-secrets. Das gibt es hier
#   nicht, und ein Benachrichtigungsziel wird nicht geraten. Alarme laufen
#   auf, sind in der Alertmanager-UI sichtbar, gehen aber vorerst nirgends hin.
# - zfs-rules entfallen: der Talos-Node hat kein ZFS, node_zfs_* gibt es nicht.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: flux-metrics-configmap
      valuesKey: flux-metrics.yaml
  values:
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.gismo2004.cc
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        externalUrl: https://alertmanager.gismo2004.cc
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: miroir-local
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd laeuft auf der Control Plane
    kubeProxy:
      enabled: false # cilium mit kubeProxyReplacement, es gibt keinen kube-proxy
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.gismo2004.cc
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.gismo2004.cc
        # Ohne diese fuenf sammelt Prometheus nur Objekte mit dem Helm-Label
        # dieser Release -- die bereits vorhandenen PodMonitors (reloader,
        # envoy-proxy) und alles kuenftige aus anderen Namespaces blieben sonst
        # unbeachtet.
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 30d
        retentionSize: 40GiB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: miroir-local
              resources:
                requests:
                  storage: 50Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
    grafana:
      # Disabled in favour of grafana-operator and curated dashboards in o11y/dashboards
      enabled: false
      forceDeployDashboards: false
      defaultDashboardsEnabled: false
    defaultRules:
      disabled:
        # Replaced by node-memory-rules below: the Proxmox host runs at ~95 %
        # by design (VMs + 16 GB ZFS ARC), so the 90 % rule fired permanently.
        NodeMemoryHighUtilization: true
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      # SMART of the Proxmox host's own disks (nvme0, sdi, sdj). The values come
      # from node-exporter's textfile collector on the host (smartmon.prom and
      # nvme.prom, refreshed every 15 minutes); the disks passed through to
      # TrueNAS are watched by TrueNAS itself.
      node-memory-rules:
        groups:
          - name: node-memory
            rules:
              - alert: NodeMemoryHighUtilization
                annotations:
                  summary: Memory on {{ $labels.instance }} is {{ $value | humanize }}% used.
                expr: 100 - (node_memory_MemAvailable_bytes{job="node-exporter", instance!="proxmox"} / node_memory_MemTotal_bytes{job="node-exporter", instance!="proxmox"} * 100) > 90
                for: 15m
                labels:
                  severity: warning
              # Absolute floor instead of a percentage: the host itself needs
              # 2-4 GB; 30-day minimum was 7.3 GB available when this was set.
              - alert: ProxmoxMemoryLow
                annotations:
                  summary: Only {{ $value | humanize1024 }}B memory available on the Proxmox host; VMs risk being OOM-killed.
                expr: node_memory_MemAvailable_bytes{instance="proxmox"} < 4 * 1024^3
                for: 15m
                labels:
                  severity: critical
      proxmox-disk-rules:
        groups:
          - name: proxmox-disks
            rules:
              - alert: ProxmoxDiskSmartUnhealthy
                annotations:
                  summary: SMART reports {{ $labels.disk }} on the Proxmox host as failing.
                expr: smartmon_device_smart_healthy{instance="proxmox"} == 0
                for: 15m
                labels:
                  severity: critical
              - alert: ProxmoxDiskSectorErrors
                annotations:
                  summary: "{{ $labels.disk }} on the Proxmox host has {{ $value }} reallocated or pending sectors."
                expr: smartmon_reallocated_sector_ct_raw_value{instance="proxmox"} + on (disk) smartmon_current_pending_sector_raw_value{instance="proxmox"} > 0
                for: 15m
                labels:
                  severity: warning
              - alert: ProxmoxNvmeUnhealthy
                annotations:
                  summary: "{{ $labels.device }} on the Proxmox host reports a critical warning, media errors or low spare."
                expr: nvme_critical_warning{instance="proxmox"} > 0 or nvme_media_errors_total{instance="proxmox"} > 0 or nvme_available_spare_ratio{instance="proxmox"} <= on (device) nvme_available_spare_threshold_ratio{instance="proxmox"}
                for: 15m
                labels:
                  severity: critical
              - alert: ProxmoxSmartDataStale
                annotations:
                  summary: "{{ $labels.file }} on the Proxmox host has not been refreshed for over an hour; the SMART alerts above are blind."
                expr: time() - node_textfile_mtime_seconds{instance="proxmox", file=~".*/(smartmon|nvme)\\.prom"} > 3600
                for: 15m
                labels:
                  severity: warning
