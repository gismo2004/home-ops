---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dashboards
spec:
  # The GrafanaDashboard CRD ships with grafana-operator. Without this the
  # Kustomization dry-run fails with `no matches for kind "GrafanaDashboard"`
  # on a fresh bootstrap -- which is exactly what happened on the first push.
  dependsOn:
    - name: grafana-operator
  interval: 1h
  path: ./kubernetes/apps/o11y/dashboards/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: o11y
  wait: false
