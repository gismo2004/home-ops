---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
# Dashboards as references, not vendored JSON. The operator fetches them and
# resolves the datasource inputs itself via spec.datasources -- exactly the
# __inputs mapping that previously had to be hand-scripted (and which silently
# broke kubernetes-volumes and blackbox-exporter on the first attempt).
#
# The pinned revisions are kept current by Renovate: the grafanaDashboards
# preset defines a custom datasource against grafana.com/api/dashboards/{id}
# and rewrites the number below. It only matches files named
# grafanadashboard.yaml -- do not rename this file.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter-full
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    # NOT DS_PROMETHEUS: this board references ${ds_prometheus} (lowercase, and
    # a plain template variable rather than an __input). The operator matches
    # inputName literally, so a wrong name silently leaves panels unresolved.
    - datasourceName: prometheus
      inputName: ds_prometheus
  url: https://grafana.com/api/dashboards/1860/revisions/45/download
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-global
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
