---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mealie
      namespace: mealie
  interval: 1h
  path: ./kubernetes/apps/mealie/mealie/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: mealie
  wait: true
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # Identity mealie@mealie:/pvc/mealie-config, unchanged.
      KOPIUR_NAME: mealie
      KOPIUR_CLAIM: mealie-config
      KOPIUR_CAPACITY: 10Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
