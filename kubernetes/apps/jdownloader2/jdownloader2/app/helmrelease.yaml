# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jdownloader2
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: jdownloader2
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      jdownloader2:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/jlesage/jdownloader-2
              tag: v26.08.2@sha256:f16d47986bf6a5db6d67484e3b7e76404bce74f6f212809127a79eb76aa1c641
            env:
              PUID: "568"
              PGID: "568"
              VNC_PASSWORD: "tesalonicher"
              VNC_EXTRA_ARGS: "-BlacklistThreshold 0 -BlacklistTimeout 0"
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              capabilities:
                add:
                  - NET_BIND_SERVICE
                  - KILL
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            probes:
              liveness:
                type: TCP
                port: 5800
                spec:
                  initialDelaySeconds: 12
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                type: TCP
                port: 5800
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 12
                  timeoutSeconds: 5
                  failureThreshold: 4
                  successThreshold: 2
              startup:
                type: TCP
                port: 5800
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 4000m
                memory: 6Gi
    service:
      app:
        controller: jdownloader2
        ports:
          main:
            port: 10054
            targetPort: 5800
          myjd:
            port: 3129
            targetPort: 3129
          vnc:
            port: 10056
            targetPort: 5900
    # Exactly one enabled Service, so app-template 5.x auto-detects the
    # backendRef and no explicit rules: block is needed.
    route:
      app:
        hostnames:
          - "jdownloader.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: jdownloader2-config
      output:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Backup/private/WD_15_backup/Seagate/Incomming/jdownloader
