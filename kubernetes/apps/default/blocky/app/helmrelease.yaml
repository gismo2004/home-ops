---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
spec:
  chartRef:
    kind: OCIRepository
    name: blocky
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [568]
        sysctls:
          # Without this an unprivileged container cannot bind a port below
          # 1024 and blocky fails at startup with a hard bind error. Do not
          # remove.
          - name: net.ipv4.ip_unprivileged_port_start
            value: "53"
    controllers:
      blocky:
        annotations:
          reloader.stakater.com/auto: "true"
        # Two replicas. No failure-domain benefit on a single node, but it
        # absorbs an unplanned pod death without a DNS gap -- blocky needs
        # ~12s to download and parse its blocklists before it serves.
        # maxUnavailable 0 / maxSurge 1 makes planned restarts zero-downtime.
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        containers:
          app:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: v0.34.0@sha256:595136fb127f4c952b621113e668c09acdcf15ac054d96ee6d4c51a76c35f5fd
            probes:
              liveness: &probe
                type: HTTP
                path: /
                port: 4000
              readiness: *probe
              startup:
                type: HTTP
                path: /
                port: 4000
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add: ["NET_BIND_SERVICE"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                memory: 2400Mi
          codeserver:
            # Kept so the hand-maintained blacklist/whitelist files on the
            # blocky-data PVC stay editable live, which is that PVC's whole
            # reason for existing.
            image:
              repository: ghcr.io/linuxserver/code-server
              tag: 4.134.0@sha256:212d588e21815316d6525abe8d14bb0114fc2cf0499f08e9e34a1b514b1055b9
            env:
              PUID: "568"
              PGID: "568"
              TZ: Europe/Vienna
              DEFAULT_WORKSPACE: /mnt/data
              PORT: "12321"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                memory: 2400Mi
    service:
      dns:
        controller: blocky
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.0.0.200"
        # Local preserves the client source IP, which clientLookup and
        # clientGroupsBlock depend on. With Cluster every query would appear to
        # come from a node IP and the per-client rules (the "fernseher" group)
        # would silently stop matching while DNS otherwise looked healthy.
        externalTrafficPolicy: Local
        ports:
          dns-udp:
            port: &dns 53
            protocol: UDP
            targetPort: *dns
          dns-tcp:
            port: *dns
            protocol: TCP
            targetPort: *dns
      app:
        controller: blocky
        ports:
          http:
            port: 4000
      codeserver:
        controller: blocky
        ports:
          http:
            port: 12321
    # More than one Service, so 5.x auto-detection does not apply and the
    # backend must be named. Only codeserver is exposed over HTTP; DNS is the
    # LoadBalancer above.
    route:
      app:
        hostnames:
          - "blocky.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
      codeserver:
        hostnames:
          - "blockycs.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: codeserver
                port: http
    persistence:
      config:
        type: configMap
        name: blocky-conf
        globalMounts:
          # No subPath, matching the old working release. blocky accepts a
          # config directory, so the ConfigMap mounts as a directory here.
          # Do not "fix" this to a subPath mount without testing it.
          - path: /app/config.yml
      lists:
        existingClaim: blocky-data
        globalMounts:
          - path: /mnt/data
