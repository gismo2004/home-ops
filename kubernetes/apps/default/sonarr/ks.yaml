---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sonarr
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sonarr
      namespace: media
  interval: 1h
  path: ./kubernetes/apps/default/sonarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # media is shared by five apps, so each needs its own distinct policy and
      # claim names or their snapshot identities collide.
      KOPIUR_NAME: sonarr-config
      KOPIUR_CLAIM: sonarr-config
      KOPIUR_CAPACITY: 10Gi
