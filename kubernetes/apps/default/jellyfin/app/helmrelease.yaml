---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: jellyfin
  interval: 1h
  values:
    defaultPodOptions:
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # 44 = video, 107 = render. Both are needed for the container to open
        # the GPU device nodes.
        supplementalGroups: [44, 107, 568]
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
            env:
              NVIDIA_DRIVER_CAPABILITIES: all
              JELLYFIN_CACHE_DIR: /cache
              JELLYFIN_CONFIG_DIR: /config/config
              JELLYFIN_DATA_DIR: /config
              JELLYFIN_LOG_DIR: /logs
              JELLYFIN_PublishedServerUrl: "https://{{ .Release.Name }}.gismo2004.cc"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
                nvidia.com/gpu: 1
              limits:
                memory: 24Gi
                nvidia.com/gpu: 1
    service:
      app:
        controller: jellyfin
        ports:
          main:
            port: &port 8096
            targetPort: *port
      autodiscovery:
        controller: jellyfin
        ports:
          autodiscovery:
            port: 7359
            protocol: UDP
            targetPort: 7359
    # Two Services, so the backend is named explicitly.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        # Internal only. It was on envoy-external (public via Cloudflare)
        # for remote playback over the holidays; back on the LAN since
        # 2026-09-28. Clients resolve it through k8s-gateway.
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: main
    persistence:
      config:
        existingClaim: jellyfin-config
      # The old chart also mounted a 100Gi jellyfin-data PVC at /data. It was
      # completely empty (only lost+found) and referenced by no JELLYFIN_*_DIR
      # variable -- a leftover from a past chart default. Deliberately not
      # recreated.
      cache:
        type: emptyDir
      # In RAM, not on the node disk: that disk is the Talos OS disk, which
      # etcd shares. On 2026-09-30 an unthrottled 4K->1080p GPU transcode
      # wrote ~100 MB/s here, etcd's fsync stalled 8 s and the apiserver
      # went down. Throttling + segment deletion (encoding settings) keep a
      # stream to ~3 GB, so 8Gi fits two at once; counts against the 24Gi limit.
      transcode:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Gi
        globalMounts:
          - path: /cache/transcodes
      logs:
        type: emptyDir
      devshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 24Gi
        globalMounts:
          - path: /dev/shm
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 24Gi
        globalMounts:
          - path: /tmp
      # Same in-pod path as before (/mnt/movies) so Jellyfin's items, hearts
      # and played state are untouched; only the source moved into the
      # shared Storage1/data dataset (2026-09-30).
      movies:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/data
        globalMounts:
          - path: /mnt/movies
            subPath: media/movies
      music:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/music
        globalMounts:
          - path: /mnt/music
      # Same in-pod path as before (/mnt/tvshows); source moved into the
      # shared Storage1/data dataset like movies.
      tv:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/data
        globalMounts:
          - path: /mnt/tvshows
            subPath: media/tv
