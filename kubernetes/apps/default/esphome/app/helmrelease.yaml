---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
spec:
  chartRef:
    kind: OCIRepository
    name: esphome
  interval: 1h
  values:
    defaultPodOptions:
      annotations:
        # Second interface on the LAN so mDNS discovery reaches the pod; see
        # kube-system/multus/networks/lan.yaml. The Service address is unchanged.
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "lan",
            "namespace": "kube-system",
            "ips": ["10.0.0.251/24"],
            "mac": "02:00:0a:00:00:fb"
          }]
      securityContext:
        # Rootless home-operations image. The volumes were written by the old
        # root image; fsGroup gives group 568 read/write on everything on the
        # first mount (the root-dir gid mismatch triggers the recursive pass),
        # so no root step is needed to take them over.
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      esphome:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/esphome
              tag: 2026.9.0@sha256:591508393e9862d30fb455775b72a97bb96906bdc787f5c499ef5c636d3069e5
            env:
              ESPHOME_DASHBOARD_USE_PING: "true"
              # The image defaults this to /cache/data. Keep the dashboard's
              # device state where the old image kept it, on the backed-up
              # config volume.
              ESPHOME_DATA_DIR: /config/.esphome
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 6052
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 6052
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 6052
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 12Gi
    service:
      app:
        controller: esphome
        ports:
          http:
            port: 6052
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: esphome-config
      cache:
        existingClaim: esphome-cache
      build:
        existingClaim: esphome-build
      tmp:
        type: emptyDir
