# Only esphome-config is backed up and restored -- it holds the device YAML,
# secrets and the peer-link key. cache and build are regenerated compilation
# artifacts; the old cluster deliberately had no policy for them, and they were
# never declared in git at all (leftovers from the earlier VolSync migration).
# They are plain PVCs here so the tree is now self-contained.
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: esphome
spec:
  compression: { compressor: zstd }
  mover:
    # 568, the uid the app runs as. Restored files are owned by the mover's
    # uid, so a root mover would hand the app files it cannot write.
    securityContext: { runAsUser: 568, runAsGroup: 568 }
    cache: { capacity: 2Gi, mode: Persistent, storageClassName: miroir-local }
  repository: { kind: ClusterRepository, name: default }
  credentialProjection: { enabled: true }
  # Only the sources: device YAML, secrets, the device-builder files (with the
  # peer-link key), the version-history .git and .esphome/storage. Everything
  # excluded here is regenerated by the next compile. An explicit list replaces
  # kopiur's defaults, so those are repeated.
  files:
    ignoreRules:
      - /lost+found
      - $RECYCLE.BIN
      - .snapshot
      - "@eaDir"
      - System Volume Information
      - /.esphome/build/
      - /.esphome/.espressif/
      - /.esphome/external_components/
      - /.esphome/pio_components/
      - /.esphome/idedata/
      - /.esphome/font/
  retention: { keepLatest: 3, keepHourly: 24, keepDaily: 2, keepWeekly: 4 }
  sources:
    - pvc: { name: esphome-config }
  volumeSnapshotClassName: miroir-snap
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: esphome
spec:
  policyRef: { name: esphome }
  schedule: { cron: "H 0,6,12,18 * * *" }
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: esphome-config
spec:
  credentialProjection: { enabled: true }
  mover:
    securityContext: { runAsUser: 568, runAsGroup: 568 }
  policy: { onMissingSnapshot: Fail }
  source:
    fromPolicy: { name: esphome, offset: 0 }
  target: { populator: {} }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-config
spec:
  accessModes: [ReadWriteOnce]
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: esphome-config
  resources: { requests: { storage: 10Gi } }
  storageClassName: miroir-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-cache
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
  storageClassName: miroir-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-build
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
  storageClassName: miroir-local
