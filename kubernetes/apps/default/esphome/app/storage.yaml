---
# Toolchains and build output (/cache/build, /cache/pio, /cache/idf); all
# regenerated, so it has no backup. The backed-up config volume comes from
# components/kopiur/backup (see ks.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-cache
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
  storageClassName: miroir-local
