# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Calibre-Web-Automated: web UI (mobile, Send-to-Kindle, OPDS, Kobo sync) on the
# existing Calibre library, plus an ingest service. Replaces desktop Calibre
# (calibre app, replicas 0): only one of them may write metadata.db at a time.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: calibre-web
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      calibre-web:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/crocodilestick/calibre-web-automated
              tag: v4.0.8@sha256:5e00373854247750cc3e4479b492ae09293ff5e06ed10177f226634d97888679
            env:
              TZ: Europe/Vienna
              PUID: "568"
              PGID: "568"
              # The library is on NFS: no SQLite WAL (locking/corruption risk on
              # network filesystems), no recursive chown, and polling watchers for
              # ingest/metadata instead of inotify.
              NETWORK_SHARE_MODE: "true"
              CWA_PORT_OVERRIDE: "8083"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8083
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8083
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8083
                  failureThreshold: 60
                  periodSeconds: 10
            # s6 init (several services: web, ingest, conversion, metadata
            # enforcement) needs root to drop to PUID 568, like desktop Calibre.
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              capabilities:
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 400Mi
              limits:
                cpu: 4000m
                memory: 2Gi
    service:
      app:
        controller: calibre-web
        ports:
          http:
            port: 8083
            targetPort: 8083
    # Single Service, so app-template 5.x auto-detects the backendRef. LAN only.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: calibre-web-config
        globalMounts:
          - path: /config
      library:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/ebooks
        globalMounts:
          - path: /calibre-library
      # SABnzbd's "ebooks" category folder; the local SAB scripts move finished
      # books here. CWA imports every file into the library and DELETES it here.
      ingest:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/data
        globalMounts:
          - path: /cwa-book-ingest
            subPath: usenet/complete/ebooks
