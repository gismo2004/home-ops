---
# Declared as bare Kustomize resources, not app-template's existingClaim
# output and not Helm-templated at all, so no future Helm release can ever
# consider them part of its own release manifest and delete them on an
# uninstall/chart swap.
#
# The PVC's dataSourceRef claims its Restore populator in restore.yaml —
# Kopiur fills it from the kavita-config SnapshotPolicy's most recent
# snapshot before anything else can mount it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kavita-config
  annotations:
    # Temporary, while this moves to components/kopiur/backup.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: kavita-config
  resources:
    requests:
      storage: 10Gi
  storageClassName: miroir-local
