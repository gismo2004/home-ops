---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
# Kept permanently alongside pvc.yaml (not one-time infrastructure like a
# VolSync ReplicationDestination would be): the PVC's dataSourceRef claims
# this Restore as its populator, so if the PVC is ever deleted again in
# some future accident, simply recreating it with the same dataSourceRef
# automatically re-triggers a restore from the latest snapshot — no manual
# intervention needed.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: kavita-config
spec:
  credentialProjection:
    enabled: true
  # matches snapshotpolicy.yaml's mover identity — without this the
  # restore mover defaults to its own uid/gid (65532), leaving every
  # restored file owned by that instead of the app's real PUID/PGID (568).
  mover:
    securityContext:
      runAsUser: 568
      runAsGroup: 568
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: kavita-config
      offset: 0
  target:
    populator: {}
