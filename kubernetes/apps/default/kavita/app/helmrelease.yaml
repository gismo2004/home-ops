# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kavita
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kavita
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      kavita:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/kavita
              tag: 0.9.1@sha256:34dddd2e79854772b788e5847f1702444b11118bbeabd0a5590f57e15346222b
            # Started directly as 568 instead of through the linuxserver s6 init, whose
            # svc-kavita always calls s6-setuidgid abc (no non-root branch). That init
            # only copied the default appsettings.json (present on the PVC) and chowned
            # /config (already 568) and wwwroot/index.html (only rewritten for a
            # non-default base URL). Tested in a throwaway pod first.
            command:
              - /app/kavita/Kavita
            workingDir: /app/kavita
            env:
              TZ: Europe/Vienna
              # Same as the s6 start: abc's home is /config, where ASP.NET keeps its
              # DataProtection keys (excluded from the backup, see kustomization.yaml),
              # and jemalloc is preloaded.
              HOME: /config
              LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5000
                  failureThreshold: 60
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
    service:
      app:
        controller: kavita
        ports:
          main:
            port: 10189
            targetPort: 5000
    # Single Service, so app-template 5.x auto-detects the backendRef.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: kavita-config
      books:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/ebooks
        globalMounts:
          - path: /mnt/books
