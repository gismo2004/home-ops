---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: kavita-config
  annotations:
    # Temporary, while this moves to components/kopiur/backup.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  compression:
    compressor: zstd
  mover:
    # unlike most containerforge apps, kavita's main .NET process never
    # drops privileges to the PUID user -- essentially all of /config
    # (kavita.db, appsettings.json, covers, backups) is owned uid 0, not
    # 568. It IS all group-readable (group 568), so the unelevated mover
    # can read almost everything via group permission -- except one
    # ASP.NET DataProtection key (mode 600, no group access), excluded
    # below rather than granting privileged-movers for a single
    # regenerable auth key (losing it just forces a re-login).
    securityContext:
      runAsUser: 568
      runAsGroup: 568
    cache:
      capacity: 2Gi
      # Persistent, see components/kopiur/backup/snapshotpolicy.yaml.
      mode: Persistent
      storageClassName: miroir-local
  files:
    ignoreRules:
      - /lost+found
      - System Volume Information
      - $RECYCLE.BIN
      - "@eaDir"
      - .snapshot
      - /.aspnet/DataProtection-Keys
  repository:
    kind: ClusterRepository
    name: default
  credentialProjection:
    enabled: true
  retention:
    keepLatest: 4
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: kavita-config
  volumeSnapshotClassName: miroir-snap
