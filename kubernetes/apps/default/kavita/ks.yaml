---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kavita
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kavita
      namespace: kavita
  interval: 1h
  path: ./kubernetes/apps/default/kavita/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kavita
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # Identity kavita-config@kavita:/pvc/kavita-config, unchanged.
      KOPIUR_NAME: kavita-config
      KOPIUR_CLAIM: kavita-config
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_ONMISSING: Continue
