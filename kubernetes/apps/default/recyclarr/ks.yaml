---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# No backup component: recyclarr keeps no state worth restoring. Its config is
# the ConfigMap from git, and its cache (guide repos, CF id mappings) is
# rebuilt on every run from an emptyDir.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recyclarr
  namespace: default
spec:
  interval: 1h
  path: ./kubernetes/apps/default/recyclarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: recyclarr
  wait: false
