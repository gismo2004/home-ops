# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: recyclarr
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      recyclarr:
        type: cronjob
        cronjob:
          # Daily sync of the TRaSH Guides profiles/custom formats into
          # radarr and sonarr (both in the media namespace).
          schedule: "30 4 * * *"
          timeZone: Europe/Vienna
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.7.2@sha256:6e69e009e1cd7493ff6093e8e187b5d3788c75b4a2c0c5127b6a1beda1c19728
            args:
              - sync
            envFrom:
              - secretRef:
                  name: recyclarr-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Nightly, after the 04:30 sync: appends each file's real audio format
      # and HDR type (from the arr's own media analysis) to its stored
      # release name when the name lacks them, so existing files are scored
      # by their content (see scripts/tag_content.py).
      content-tagger:
        type: cronjob
        cronjob:
          schedule: "0 5 * * *"
          timeZone: Europe/Vienna
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.14-alpine@sha256:2e740b2c28a426e74f11396c05e38afb3191acced75045b8d62df573c1dc8ce8
            command: ["python3", "-B", "/scripts/tag_content.py"]
            env:
              RADARR_URL: http://radarr.media.svc.cluster.local:7878
              SONARR_URL: http://sonarr.media.svc.cluster.local:8989
            envFrom:
              - secretRef:
                  name: recyclarr-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: recyclarr-config
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true
          - path: /config/settings.yml
            subPath: settings.yml
            readOnly: true
      custom-formats-radarr:
        type: configMap
        name: recyclarr-custom-formats-radarr
        globalMounts:
          - path: /custom-formats/radarr
            readOnly: true
      custom-formats-sonarr:
        type: configMap
        name: recyclarr-custom-formats-sonarr
        globalMounts:
          - path: /custom-formats/sonarr
            readOnly: true
      tmp:
        type: emptyDir
      scripts:
        type: configMap
        name: recyclarr-scripts
        advancedMounts:
          content-tagger:
            app:
              - path: /scripts
                readOnly: true
