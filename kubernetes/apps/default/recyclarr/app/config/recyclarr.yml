# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# TRaSH Guides "[German] UHD Bluray + WEB (Alternative)": 720p-2160p in one
# merged group, ranked by custom-format score, so 4K wins when it exists and
# 1080p is the fallback. Blocks BR-DISK, AV1 and German LQ releases via the
# "Unwanted Formats German" group. Remux qualities are not in the profile,
# which also keeps VC-1 (practically only found in old Blu-ray remuxes) out.
# German audio is required, unlike TRaSH's default (English as fallback):
# "Not German" is our own CF from ./custom-formats (see settings.yml), -35000
# in the profile, so a release without German audio or "German" in its title
# can never reach the minimum score.
# Templates: https://github.com/recyclarr/config-templates

radarr:
  radarr:
    base_url: http://radarr.media.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: 425da1ba30711b55d2eb371437ec98d7 # [German] UHD Bluray + WEB (Alternative)
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Merged QPs
          until_score: 45000 # TRaSH's 35000 + the resolution offset below
    custom_formats:
      - trash_ids:
          - 4aaff9587c0e57ce866a9ede0168f8f8 # Not German (own, ./custom-formats)
        assign_scores_to:
          - trash_id: 425da1ba30711b55d2eb371437ec98d7
      # Tuned for a 5.1 system without height speakers (2026-09-30): lossy
      # Atmos plays as plain 5.1 there, so it gets DD+'s score instead of 3000.
      # Lossless Atmos (TrueHD Atmos, DTS:X) keeps its score.
      - trash_ids:
          - 417804f7f2c4308c1f4c5d380d4c4475 # ATMOS (undefined)
          - 1af239278386be2919e1bcee0bde047e # DD+ ATMOS
        assign_scores_to:
          - trash_id: 425da1ba30711b55d2eb371437ec98d7
            score: 1750
      # Bluray encodes over WEB at the same resolution: +1500 outweighs the
      # lossy-audio score gaps (DD+ vs DD/DTS), which otherwise let a WEB
      # release win despite the visibly worse picture on a 77" TV.
      - trash_ids:
          - 949585e48d9255cb92a868640536e61c # Source: Bluray (own, ./custom-formats)
        assign_scores_to:
          - trash_id: 425da1ba30711b55d2eb371437ec98d7
      # Resolution first (2026-09-30). TRaSH scores 720p/1080p/2160p at
      # 5/50/100, so German+English audio (+1000 over German-only), a better
      # release group or lossless audio let a 720p release replace a 1080p
      # file (Ninjago S08 kept retrying 720p "DL" over 1080p German).
      # +10000 on 1080p and 2160p is more than everything a 720p release can
      # gain elsewhere; 2160p keeps its lead over 1080p. The cutoff score
      # moves up by the same 10000.
      - trash_ids:
          - 820b09bb9acbfde9c35c71e0e565dad8 # 1080p
        assign_scores_to:
          - trash_id: 425da1ba30711b55d2eb371437ec98d7
            score: 10050
      - trash_ids:
          - fb392fb0d61a010ae38e49ceaa24a1ef # 2160p
        assign_scores_to:
          - trash_id: 425da1ba30711b55d2eb371437ec98d7
            score: 10100
    custom_format_groups:
      add:
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d # [Optional] Golden Rule UHD
        - trash_id: 0ca61b4b233178d07113082a7acff72d # [Unwanted] Unwanted Formats German
        - trash_id: 1616617ab3a14397a2b2321bcbda44d1 # [HDR Formats] DV Boost (box and TV do DV)

sonarr:
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 7324309a7d1e10dc0dc2cea6c70ed852 # [German] UHD Bluray + WEB (Alternative)
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Merged QPs
          until_score: 45000 # TRaSH's 35000 + the resolution offset below
        # TRaSH's group plus HDTV: German TV shows (cooking/kids/docs) are
        # often only released as TV recordings. Scores still rank WEB and
        # Bluray above HDTV when both exist.
        qualities:
          - name: Merged QPs
            qualities:
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - HDTV-2160p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
    custom_formats:
      - trash_ids:
          - 4aaff9587c0e57ce866a9ede0168f8f8 # Not German (own, ./custom-formats)
        assign_scores_to:
          - trash_id: 7324309a7d1e10dc0dc2cea6c70ed852
      # TRaSH's German series profile scores no audio. Added (2026-09-30) so a
      # Bluray rip with lossless audio beats a streaming grab with DD+ on the
      # user's 5.1 system. TRaSH default scores; the audio-formats group is
      # not offered for this profile, hence the explicit list.
      - trash_ids:
          - 0d7824bb924701997f874e7ff7d4844a # TrueHD ATMOS
          - 9d00418ba386a083fbf4d58235fc37ef # DTS X
          - 1808e4b9cee74e064dfae3f1db99dbfe # TrueHD
          - c429417a57ea8c41d57e6990a8b0033f # DTS-HD MA
          - 851bd64e04c9374c51102be3dd9ae4cc # FLAC
          - 30f70576671ca933adbdcfc736a69718 # PCM
          - cfa5fbd8f02a86fc55d8d223d06a5e1f # DTS-HD HRA
          - 63487786a8b01b7f20dd2bc90dd4a477 # DD+
          - c1a25cd67b5d2e08287c957b1eb903ec # DTS-ES
          - 5964f2a8b3be407d083498e4459d05d0 # DTS
          - a50b8a0c62274a7c38b09a9619ba9d86 # AAC
          - dbe00161b08a25ac6154c55f95e6318d # DD
          - 3e8b714263b26f486972ee1e0fe7606c # MP3
          - 28f6ef16d61e2d1adfce3156ed8257e3 # Opus
        assign_scores_to:
          - trash_id: 7324309a7d1e10dc0dc2cea6c70ed852
      # Lossy Atmos plays as plain 5.1 without height speakers: DD+'s score.
      - trash_ids:
          - b6fbafa7942952a13e17e2b1152b539a # ATMOS (undefined)
          - 4232a509ce60c4e208d13825b7c06264 # DD+ ATMOS
        assign_scores_to:
          - trash_id: 7324309a7d1e10dc0dc2cea6c70ed852
            score: 1750
      # With audio scored, a WEB DD+ grab would beat a Bluray rip with plain
      # DD; +1500 keeps Bluray (non-remux) first at the same resolution.
      - trash_ids:
          - 949585e48d9255cb92a868640536e61c # Source: Bluray (own, ./custom-formats)
        assign_scores_to:
          - trash_id: 7324309a7d1e10dc0dc2cea6c70ed852
      # Resolution first (2026-09-30). TRaSH scores 720p/1080p/2160p at
      # 5/50/100, so German+English audio (+1000 over German-only), a better
      # release group or lossless audio let a 720p release replace a 1080p
      # file (Ninjago S08 kept retrying 720p "DL" over 1080p German).
      # +10000 on 1080p and 2160p is more than everything a 720p release can
      # gain elsewhere; 2160p keeps its lead over 1080p. The cutoff score
      # moves up by the same 10000.
      - trash_ids:
          - 290078c8b266272a5cc8e251b5e2eb0b # 1080p
        assign_scores_to:
          - trash_id: 7324309a7d1e10dc0dc2cea6c70ed852
            score: 10050
      - trash_ids:
          - 1bef6c151fa35093015b0bfef18279e5 # 2160p
        assign_scores_to:
          - trash_id: 7324309a7d1e10dc0dc2cea6c70ed852
            score: 10100
    custom_format_groups:
      add:
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c # [Optional] Golden Rule UHD
        - trash_id: 6f0872eebfc95b1f93474b7ac866ced0 # [Unwanted] Unwanted Formats German
        - trash_id: e0b2774083df4265f25c9e5bc6c80940 # [HDR Formats] DV Boost (box and TV do DV)
