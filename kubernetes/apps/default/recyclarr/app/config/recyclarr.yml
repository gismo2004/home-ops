        assign_scores_to:
          - trash_id: 7324309a7d1e10dc0dc2cea6c70ed852
            score: 1750
      # With audio scored, a WEB DD+ grab would beat a Bluray rip with plain
      # DD; +1500 keeps Bluray (non-remux) first at the same resolution.
      - trash_ids:
          - 949585e48d9255cb92a868640536e61c # Source: Bluray (own, ./custom-formats)
        assign_scores_to:
