    custom_format_groups:
      add:
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d # [Optional] Golden Rule UHD
        - trash_id: 0ca61b4b233178d07113082a7acff72d # [Unwanted] Unwanted Formats German
        - trash_id: 1616617ab3a14397a2b2321bcbda44d1 # [HDR Formats] DV Boost (box and TV do DV)

sonarr:
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
    quality_profiles:
      # Old kids' classics (Tom and Jerry, Pokémon, Yakari, Pink Panther,
      # Turtles) mostly exist only as DVD/TV recordings, which the TRaSH
      # profile does not allow (it would chase HD forever). Same rules
      # otherwise: German required, resolution decides, junk blocked;
      # German and German DL score alike so they never replace each other.
      - name: "[German] SD + HD (Klassiker)"
        reset_unmatched_scores:
          enabled: true
        min_upgrade_format_score: 500
        upgrade:
          allowed: true
          until_quality: Merged QPs
          until_score: 20000 # German 1080p
        min_format_score: 0
        qualities:
          - name: Merged QPs
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
              - Bluray-576p
              - Bluray-480p
              - WEBDL-480p
              - WEBRip-480p
              - DVD
              - SDTV
      - trash_id: 7324309a7d1e10dc0dc2cea6c70ed852 # [German] UHD Bluray + WEB (Alternative)
        reset_unmatched_scores:
          enabled: true
        min_upgrade_format_score: 500 # tiny differences are no upgrade
        upgrade:
          allowed: true
          until_quality: Merged QPs
          until_score: 45000 # TRaSH's 35000 + the resolution offset below
        # TRaSH's group plus HDTV: German TV shows (cooking/kids/docs) are
        # often only released as TV recordings. Scores still rank WEB and
        # Bluray above HDTV when both exist.
        qualities:
          - name: Merged QPs
            qualities:
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - HDTV-2160p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
    custom_formats:
      - trash_ids:
          - 4aaff9587c0e57ce866a9ede0168f8f8 # Not German (own, ./custom-formats)
        assign_scores_to:
          - trash_id: 7324309a7d1e10dc0dc2cea6c70ed852
      # TRaSH's German series profile scores no audio. Added (2026-09-30) so a
      # Bluray rip with lossless audio beats a streaming grab with DD+ on the
      # user's 5.1 system. TRaSH default scores; the audio-formats group is
      # not offered for this profile, hence the explicit list.
      - trash_ids:
          - 0d7824bb924701997f874e7ff7d4844a # TrueHD ATMOS
          - 9d00418ba386a083fbf4d58235fc37ef # DTS X
          - 1808e4b9cee74e064dfae3f1db99dbfe # TrueHD
