# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ownfoil
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: ownfoil
  values:
    defaultPodOptions:
      annotations:
        # Second interface on the LAN, so Ownfoil answers the Switch clients' discovery
        # broadcast (UDP 8465) from 10.0.0.252; see kube-system/multus/networks/
        # lan-direct.yaml for why it is not lan.yaml. The client then talks to
        # http://10.0.0.252:8465 directly; the route stays for the web UI.
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "lan-direct",
            "namespace": "kube-system",
            "ips": ["10.0.0.252/24"],
            "mac": "02:00:0a:00:00:fc"
          }]
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      ownfoil:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/a1ex4/ownfoil
              tag: 2.5.0@sha256:123130aad6a260b1eeacf3968b6b56fbf510662034faab2f4cd2da08d967f3f7
            # run.sh needs root (adduser, chown /app, sudo). Ownfoil itself writes only
            # to /app/config, /app/data and $HOME, so it is started directly as 568.
            command:
              - python
              - /app/run.py
            workingDir: /app
            envFrom:
              # USER_ADMIN_NAME/PASSWORD (web UI) and USER_GUEST_NAME/PASSWORD (shop
              # access for the Switch); Ownfoil creates or updates both at startup.
              - secretRef:
                  name: ownfoil-secret
            env:
              TZ: Europe/Vienna
              # gunicorn's control socket goes to $HOME/.gunicorn (emptyDir below).
              HOME: /home/ownfoil
            # exec, not tcpSocket: on lan-direct the pod answers the node (the kubelet's
            # probe source) through the macvlan, which cannot reach its parent host.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &probe
                    command:
                      - python
                      - -c
                      - import socket; socket.create_connection(("127.0.0.1", 8465), 3)
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *probe
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *probe
                  failureThreshold: 60
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 200Mi
              limits:
                cpu: 1000m
                memory: 1Gi
    service:
      app:
        controller: ownfoil
        ports:
          http:
            port: &port 8465
            targetPort: *port
    # Single Service, so app-template 5.x auto-detects the backendRef. LAN only:
    # the Switch reaches the shop at https://ownfoil.gismo2004.cc.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: ownfoil-config
        globalMounts:
          - path: /app/config
      # Title database cache, re-downloaded when missing; kept out of the backup.
      data:
        type: emptyDir
        globalMounts:
          - path: /app/data
      home:
        type: emptyDir
        globalMounts:
          - path: /home/ownfoil
      # The library: dumps of the user's own cartridges, copied in via the SMB share
      # "games". Same NFS export as the media apps (Storage1/data, mapall apps:apps).
      # Gamarr imports into the same directory (its root folder
      # /data/media/games/switch), so keep the two paths in sync.
      games:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/data/media/games/switch
        globalMounts:
          - path: /games
