---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ownfoil
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ownfoil
      namespace: ownfoil
  interval: 1h
  path: ./kubernetes/apps/default/ownfoil/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ownfoil
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # Identity ownfoil-config@ownfoil:/pvc/ownfoil-config. Holds Ownfoil's settings,
      # users and library database (/app/config); the games stay on the NAS.
      KOPIUR_NAME: ownfoil-config
      KOPIUR_CLAIM: ownfoil-config
      KOPIUR_CAPACITY: 2Gi
      # New app: no snapshot exists yet. Switch to Fail once the first backup ran.
      KOPIUR_ONMISSING: Continue
