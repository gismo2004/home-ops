---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mosquitto
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mosquitto
      namespace: mosquitto
  interval: 1h
  path: ./kubernetes/apps/default/mosquitto/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: mosquitto
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # Identity mosquitto-data@mosquitto:/pvc/mosquitto-data (mosquitto.db,
      # the retained-message state), unchanged.
      KOPIUR_NAME: mosquitto-data
      KOPIUR_CLAIM: mosquitto-data
      KOPIUR_CAPACITY: 10Gi
