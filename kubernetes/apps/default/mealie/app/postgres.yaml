---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# Bare CNPG Cluster, recovering the old cluster's data.
#
# barman-cloud identifies backups by the "serverName" string in the S3 path,
# not by the Kubernetes object name, so this fresh object recovers the old
# history by naming it in externalClusters.
#
# spec.backup.serverName MUST differ from the recovery source. CNPG's restore
# job runs barman-cloud-check-wal-archive against its OWN backup destination
# before recovering and refuses with "Expected empty archive" if that prefix
# already has WAL history -- a guard against two timelines sharing a catalog.
# The old prefix is read-only from here on; new backups land under -v2.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mealie-postgres
spec:
  instances: 1
  # Exposes the Postgres metrics endpoint and creates a PodMonitor for it.
  # Off by default, which is why these three clusters produced no metrics
  # at all and the CNPG dashboard would have stayed empty.
  monitoring:
    enablePodMonitor: true
  # A single-instance cluster can never satisfy CNPG's default primary PDB
  # (minAvailable 1 -> disruptionsAllowed 0), which makes `kubectl drain` block
  # forever and would stall a Talos node upgrade.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16.14@sha256:93d0456be6e8e7a5d2d4e54953967f8b2d7f410c5ab7ca1739f42383436df035
  primaryUpdateMethod: switchover
  enableSuperuserAccess: true
  postgresUID: 26
  postgresGID: 26
  storage:
    # 20Gi/10Gi rather than the old 100Gi/100Gi: the database is ~24MB and the
    # miroir pool is 1.07TB total, so reserving 200Gi for it was wasteful.
    storageClass: miroir-local
    size: 20Gi
    resizeInUseVolumes: true
  walStorage:
    storageClass: miroir-local
    size: 10Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 75m
      memory: 200Mi
    limits:
      memory: 2400Mi
  bootstrap:
    recovery:
      database: mealie
      owner: mealie
      secret:
        name: mealie-postgres-user
      source: mealie-postgres-old
  externalClusters:
    # Reads from the LIVE bucket. Repointed when the old per-app buckets were
    # deleted; kept rather than dropped because removing bootstrap.recovery
    # makes CNPG fall back to initdb, so a rebuild-from-git would come up with
    # an EMPTY database instead of failing loudly.
    #
    # On a rebuild, spec.backup.serverName below MUST be bumped so it differs
    # from the serverName read here, or barman-cloud-check-wal-archive refuses
    # with "Expected empty archive".
    - name: mealie-postgres-old
      barmanObjectStore:
        destinationPath: s3://cnpg-gismo2004/mealie
        endpointURL: https://s3.eu-central-003.backblazeb2.com
        serverName: mealie-postgres-v4
        s3Credentials:
          accessKeyId:
            name: mealie-postgres-s3-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: mealie-postgres-s3-creds
            key: ACCESS_SECRET_KEY
  backup:
    retentionPolicy: 5d
    barmanObjectStore:
      # Dedicated bucket. The old per-app buckets had accumulated one archive
      # per migration attempt -- six serverName generations in hass totalling
      # 29GB, of which the live one was 60MB -- and were deleted once a base
      # backup existed here.
      destinationPath: s3://cnpg-gismo2004/mealie
      endpointURL: https://s3.eu-central-003.backblazeb2.com
      serverName: mealie-postgres-v4
      # gzip, not bzip2. Measured on this node/link: the B2 upload tops out at
      # 3.4 MB/s while bzip2 compresses at only 5.7 MB/s -- so bzip2 pegged a
      # full core just to feed a link it could barely keep ahead of. gzip runs at
      # 22.8 MB/s for a ratio only 4 points worse (70% vs 66%), i.e. ~16s more
      # upload per GB for roughly a quarter of the CPU. lz4/snappy are faster
      # still but compress worse, and since the link is the ceiling that is a
      # net loss. CNPG's enum offers no zstd.
      data:
        compression: gzip
        jobs: 2
      wal:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: mealie-postgres-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: mealie-postgres-s3-creds
          key: ACCESS_SECRET_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mealie-postgres-daily
spec:
  schedule: "0 0 0 * * *"
  immediate: true
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: mealie-postgres
