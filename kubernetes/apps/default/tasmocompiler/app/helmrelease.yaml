---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tasmocompiler
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tasmocompiler
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      tasmocompiler:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/benzino77/tasmocompiler
              tag: latest@sha256:15ba4221fa594b597baf90b8e2acbff058de6cbd6215b4cc00506fab50157f57
            probes:
              liveness:
                type: HTTP
                path: /
                port: 3000
              readiness:
                type: HTTP
                path: /
                port: 3000
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
    service:
      app:
        controller: tasmocompiler
        # ClusterIP, not LoadBalancer. This was the one Service with no
        # address annotation, so metallb just handed it the first free address
        # in the pool (10.0.0.130) -- an accident of allocation order rather
        # than anything depending on it. It is reached through the Gateway at
        # tasmocompiler.gismo2004.cc, so a dedicated LAN address is redundant.
        # Direct access to 10.0.0.130:14003 goes away; the hostname does not.
        ports:
          main:
            port: 14003
            targetPort: 3000
    # Single Service, so app-template 5.x auto-detects the backendRef.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
