---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./secret.sops.yaml
patches:
  # Back up settings, sidecar files and the nightly database dumps
  # (storage/backup); skip the regenerable thumbnail cache. An explicit
  # list replaces Kopiur's defaults, hence the OS-artifact entries.
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
    patch: |-
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      metadata:
        name: placeholder
      spec:
        files:
          ignoreRules:
            - /lost+found
            - $$RECYCLE.BIN
            - .snapshot
            - "@eaDir"
            - System Volume Information
            - /cache/
