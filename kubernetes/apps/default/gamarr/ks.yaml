---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gamarr
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gamarr
      namespace: gamarr
  interval: 1h
  path: ./kubernetes/apps/default/gamarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: gamarr
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # Identity gamarr-config@gamarr:/pvc/gamarr-config. Holds Gamarr's config.xml,
      # SQLite database and cover cache (/config); the games stay on the NAS.
      KOPIUR_NAME: gamarr-config
      KOPIUR_CLAIM: gamarr-config
      KOPIUR_CAPACITY: 5Gi
      # New app: no snapshot exists yet. Switch to Fail once the first backup ran.
      KOPIUR_ONMISSING: Continue
