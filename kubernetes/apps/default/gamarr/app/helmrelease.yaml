# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gamarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gamarr
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      gamarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gamarr-app/gamarr
              tag: 1.1.0.514@sha256:9e22e5924c6efb314b36f09a511ba2343b5499317dcd97ef0611280731748318
            # Started directly as 568, bypassing the image's s6 init: all it adds for
            # Gamarr is the TMPDIR (/run/gamarr-temp, an emptyDir below) and chowns
            # that are already satisfied (/config is 568, /app/gamarr is read-only use).
            command:
              - /app/gamarr/bin/Gamarr
              - -nobrowser
              - -data=/config
            workingDir: /app/gamarr/bin
            envFrom:
              # API key from the SOPS secret (GAMARR__AUTH__APIKEY), so it is
              # managed in git instead of only in config.xml.
              - secretRef:
                  name: gamarr-secret
            env:
              TZ: Europe/Vienna
              # Gamarr is a Radarr fork and reads the same Servarr options from
              # GAMARR__<SECTION>__<KEY>. TrustedNetworks is fail-closed: without
              # the pod CIDR (envoy-internal) every proxied request loses the
              # DisabledForLocalAddresses exemption. Runtime-only, config.xml
              # stays empty. See CLAUDE.md "The arr suite". Do not remove.
              GAMARR__SERVER__TRUSTEDNETWORKS: 172.16.0.0/24
              GAMARR__AUTH__REQUIRED: DisabledForLocalAddresses
              GAMARR__SERVER__PORT: &port 6767
              # Off: "analytics" are Sentry error reports to the Gamarr developer's own
              # project, carrying the last 200 log lines (game titles, release names,
              # paths at debug level). Runtime option, the UI toggle cannot undo it.
              GAMARR__LOG__ANALYTICSENABLED: "False"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 300Mi
              # clamscan loads the full signature set per scan (~1 GiB), on
              # top of Gamarr itself, when virus scanning is enabled.
              limits:
                cpu: 1500m
                memory: 2400Mi
          # ClamAV for Gamarr's import scan: the official image (Cisco Talos), clamd
          # plus its freshclam daemon, unprivileged as 568. Gamarr scans with
          # `clamdscan --stream` against it (client config gamarr-clamd-client); set in
          # Gamarr: Settings -> Media Management -> virus scanner path
          # /usr/bin/clamdscan, arguments
          # `--stream --config-file=/etc/clamav-client/clamd.conf`. clamd keeps the
          # signatures loaded once instead of clamscan reading ~1 GiB per scan.
          # No probes: Gamarr stays reachable while clamd loads, and its scans fail
          # closed (no import) until clamd answers.
          clamd:
            image:
              repository: docker.io/clamav/clamav
              tag: 1.5@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e
            command:
              - /init-unprivileged
            env:
              FRESHCLAM_CHECKS: "4"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            # clamd holds the databases (~1 GiB) and reloads them concurrently after
            # an update, briefly holding both copies.
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 3Gi
    service:
      app:
        controller: gamarr
        ports:
          http:
            port: *port
            targetPort: *port
    # Single Service, so app-template 5.x auto-detects the backendRef. LAN only.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # The image's TMPDIR; /run itself belongs to root.
      tmp:
        type: emptyDir
        advancedMounts:
          gamarr:
            app:
              - path: /run/gamarr-temp
      # Signature database (pvc.yaml).
      clamav-db:
        existingClaim: gamarr-clamav-db
        advancedMounts:
          gamarr:
            clamd:
              - path: /var/lib/clamav
      clamav-scratch:
        type: emptyDir
        advancedMounts:
          gamarr:
            clamd:
              - path: /run/clamav
                subPath: run
              - path: /var/log/clamav
                subPath: log
              - path: /tmp
                subPath: tmp
      clamd-client:
        type: configMap
        name: gamarr-clamd-client
        advancedMounts:
          gamarr:
            app:
              - path: /etc/clamav-client
                readOnly: true
      config:
        existingClaim: gamarr-config
        advancedMounts:
          gamarr:
            app:
              - path: /config
      backup:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/container_share/backups
        advancedMounts:
          gamarr:
            app:
              - path: /config/Backups
      # One filesystem for downloads and the library (same NFS export as the
      # media apps), so imports from /data/usenet/complete/games are an instant
      # rename on the NAS. Root folder /data/media/games/switch is the
      # directory ownfoil serves as /games.
      data:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/data
        advancedMounts:
          gamarr:
            app:
              - path: /data
