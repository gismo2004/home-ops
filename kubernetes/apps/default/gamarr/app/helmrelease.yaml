# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gamarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gamarr
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      gamarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/gamarr-app/gamarr
              tag: 1.1.0.490@sha256:db3ddb938e48ea05f57752dfafbeaccd61d3c0eaa71c49a749e57858d4ff0c1a
            # Started directly as 568, bypassing the image's s6 init: all it adds for
            # Gamarr is the TMPDIR (/run/gamarr-temp, an emptyDir below) and chowns
            # that are already satisfied (/config is 568, /app/gamarr is read-only use).
            command:
              - /app/gamarr/bin/Gamarr
              - -nobrowser
              - -data=/config
            workingDir: /app/gamarr/bin
            envFrom:
              # API key from the SOPS secret (GAMARR__AUTH__APIKEY), so it is
              # managed in git instead of only in config.xml.
              - secretRef:
                  name: gamarr-secret
            env:
              TZ: Europe/Vienna
              # Gamarr is a Radarr fork and reads the same Servarr options from
              # GAMARR__<SECTION>__<KEY>. TrustedNetworks is fail-closed: without
              # the pod CIDR (envoy-internal) every proxied request loses the
              # DisabledForLocalAddresses exemption. Runtime-only, config.xml
              # stays empty. See CLAUDE.md "The arr suite". Do not remove.
              GAMARR__SERVER__TRUSTEDNETWORKS: 172.16.0.0/24
              GAMARR__AUTH__REQUIRED: DisabledForLocalAddresses
              GAMARR__SERVER__PORT: &port 6767
              # Off: "analytics" are Sentry error reports to the Gamarr developer's own
              # project, carrying the last 200 log lines (game titles, release names,
              # paths at debug level). Runtime option, the UI toggle cannot undo it.
              GAMARR__LOG__ANALYTICSENABLED: "False"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 300Mi
              # clamscan loads the full signature set per scan (~1 GiB), on
              # top of Gamarr itself, when virus scanning is enabled.
              limits:
                cpu: 1500m
                memory: 2400Mi
          # ClamAV signatures for Gamarr's import scan. The image's init-clamav-config
          # and svc-freshclam need root (sed in /etc/clamav, chown, s6-setuidgid), so
          # in non-root mode they fail and leave the shared emptyDir empty -- and
          # Gamarr refuses every import without signatures. This sidecar runs the
          # freshclam daemon as 568: download at start, then four checks a day.
          freshclam:
            image: *image
            command:
              - freshclam
              - --daemon
              - --foreground
              - --checks=4
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              # freshclam loads every new database once to test it (~1 GiB);
              # 512Mi was OOMKilled on the first download.
              limits:
                memory: 1536Mi

    service:
      app:
        controller: gamarr
        ports:
          http:
            port: *port
            targetPort: *port
    # Single Service, so app-template 5.x auto-detects the backendRef. LAN only.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # The image's TMPDIR; /run itself belongs to root.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /run/gamarr-temp
      # Shared with the freshclam sidecar; the image ships these clamav-owned.
      clamav-db:
        type: emptyDir
        globalMounts:
          - path: /var/lib/clamav
      # freshclam's PidFile (/run/clamav/freshclam.pid in the image's config).
      clamav-run:
        type: emptyDir
        globalMounts:
          - path: /run/clamav
      clamav-log:
        type: emptyDir
        globalMounts:
          - path: /var/log/clamav
      config:
        existingClaim: gamarr-config
        globalMounts:
          - path: /config
      backup:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/container_share/backups
        globalMounts:
          - path: /config/Backups
      # One filesystem for downloads and the library (same NFS export as the
      # media apps), so imports from /data/usenet/complete/games are an instant
      # rename on the NAS. Root folder /data/media/games/switch is the
      # directory ownfoil serves as /games.
      data:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/data
        globalMounts:
          - path: /data
