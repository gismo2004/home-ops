# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gamarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gamarr
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      gamarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gamarr-app/gamarr
              tag: 1.1.0.490@sha256:db3ddb938e48ea05f57752dfafbeaccd61d3c0eaa71c49a749e57858d4ff0c1a
            envFrom:
              # API key from the SOPS secret (GAMARR__AUTH__APIKEY), so it is
              # managed in git instead of only in config.xml.
              - secretRef:
                  name: gamarr-secret
            env:
              PUID: "568"
              PGID: "568"
              TZ: Europe/Vienna
              # Gamarr is a Radarr fork and reads the same Servarr options from
              # GAMARR__<SECTION>__<KEY>. TrustedNetworks is fail-closed: without
              # the pod CIDR (envoy-internal) every proxied request loses the
              # DisabledForLocalAddresses exemption. Runtime-only, config.xml
              # stays empty. See CLAUDE.md "The arr suite". Do not remove.
              GAMARR__SERVER__TRUSTEDNETWORKS: 172.16.0.0/24
              GAMARR__AUTH__REQUIRED: DisabledForLocalAddresses
              GAMARR__SERVER__PORT: &port 6767
              # Off: "analytics" are Sentry error reports to the Gamarr developer's own
              # project, carrying the last 200 log lines (game titles, release names,
              # paths at debug level). Runtime option, the UI toggle cannot undo it.
              GAMARR__LOG__ANALYTICSENABLED: "False"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              # The s6 init downloads the ClamAV signatures (freshclam) before
              # Gamarr starts, which takes a while on every pod start.
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            # Non-root: linuxserver images run their s6 init as the container user
            # when it is not root (LSIO_NON_ROOT_USER) and skip the user/chown setup.
            # Needs writable /run (s6, /run/gamarr-temp) and ClamAV dirs, see the
            # emptyDirs below; the image's freshclam.conf works unedited.
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 300Mi
              # clamscan loads the full signature set per scan (~1 GiB), on
              # top of Gamarr itself, when virus scanning is enabled.
              limits:
                cpu: 1500m
                memory: 2400Mi
    service:
      app:
        controller: gamarr
        ports:
          http:
            port: *port
            targetPort: *port
    # Single Service, so app-template 5.x auto-detects the backendRef. LAN only.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # Non-root (see securityContext): the image ships these root- or
      # clamav-owned. Signatures are re-fetched on every start, as before.
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      clamav-db:
        type: emptyDir
        globalMounts:
          - path: /var/lib/clamav
      clamav-log:
        type: emptyDir
        globalMounts:
          - path: /var/log/clamav
      config:
        existingClaim: gamarr-config
        globalMounts:
          - path: /config
      backup:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/container_share/backups
        globalMounts:
          - path: /config/Backups
      # One filesystem for downloads and the library (same NFS export as the
      # media apps), so imports from /data/usenet/complete/games are an instant
      # rename on the NAS. Root folder /data/media/games/switch is the
      # directory ownfoil serves as /games.
      data:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/data
        globalMounts:
          - path: /data
