---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Trial deployment against the same NFS "Incoming" library photoview-incoming
# already serves (photoview-incoming is left running, untouched, for
# comparison -- see kubernetes/apps/default/photoview-incoming).
#
# Three controllers for one logical app (no other HelmRelease in this repo
# has needed more than one, but Immich genuinely is server + GPU ML worker +
# redis job queue as one lifecycle). Object names follow app-template's
# `<release>-<key>` convention, confirmed by rendering this chart locally
# before writing service/env references below -- controller/service keys are
# deliberately `server`/`machine-learning`/`redis` (not `immich-server` etc.)
# to avoid a doubled-up `immich-immich-server` object name.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          wait-for-db:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: "16.15"
            command:
              - /bin/sh
              - -c
              - until pg_isready -U immich -d immich -h immich-postgres-rw; do sleep 5; done
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
            envFrom:
              - secretRef:
                  name: immich-secrets
            env:
              REDIS_HOSTNAME: immich-redis
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              # Confirmed live: the microservices worker thread crashed with
              # ERR_WORKER_OUT_OF_MEMORY ("JS heap out of memory") crawling
              # this library (100k+ files and still counting), which killed
              # the whole api process and restarted the pod -- a known
              # upstream pattern on large libraries (immich-app/immich#7373,
              # #11168). This is Node's own V8 heap ceiling for that worker
              # thread, well below and independent of the container's
              # cgroup memory limit below (actual container usage never got
              # near 6Gi when this crashed).
              NODE_OPTIONS: --max-old-space-size=6144
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: &port 2283
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              # Raised alongside NODE_OPTIONS above: a 6Gi heap ceiling needs
              # real headroom above it for non-heap V8/Node overhead, or the
              # container just gets OOMKilled by the cgroup instead of the
              # worker thread hitting its own limit -- same failure, moved up
              # one layer. Node has 63Gi allocatable at ~35% used, plenty of
              # room to give this the space it's actually asking for.
              limits:
                memory: 10Gi
      machine-learning:
        pod:
          runtimeClassName: nvidia
          securityContext:
            # 44 = video, 107 = render. Both are needed for the container to
            # open the GPU device nodes -- copied from jellyfin, the only
            # other GPU consumer in this cluster.
            supplementalGroups: [44, 107, 568]
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.1.0-cuda@sha256:82d3f6a093455964508052e0b3bc55a91075b48b65be35e78b40774a72c1ebb3
            # Deliberately NOT setting MACHINE_LEARNING_MODEL_TTL below the
            # 300s default. Tried 60s to shrink the standing VRAM footprint
            # after a confirmed OCR-specific VRAM leak (immich#26739,
            # duplicate of #23462) -- but TTL expiry doesn't just unload
            # model weights, it recycles the whole worker process ("Shutting
            # down due to inactivity" -> SIGINT -> reboot, several seconds of
            # downtime each time). At 60s that happens roughly every minute
            # during normal gaps between job bursts, which repeatedly flapped
            # "Machine learning server became unhealthy" and cascaded into
            # "No microservices worker is connected" on the server side --
            # confirmed live. OCR is disabled in the admin UI now (the actual
            # leak trigger), so the shorter TTL bought nothing but instability.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &mlport 3003
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *mlport
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *mlport
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
                nvidia.com/gpu: 1
              limits:
                memory: 8Gi
                nvidia.com/gpu: 1
      redis:
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.1@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
            # Pure job queue/cache, not a source of truth -- disable RDB/AOF
            # persistence entirely so it doesn't fight the emptyDir for no
            # benefit. Losing it just means in-flight jobs get retried.
            args:
              - --save
              - ""
              - --appendonly
              - "no"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &redisport 6379
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *redisport
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                # Dropping ALL blocks the entrypoint's chown of /data and its
                # setpriv drop from root to the valkey user, even while still
                # running as root -- capabilities gate both independently of
                # UID (confirmed live: chown and setresuid both "Operation
                # not permitted" with only a subset of these added back).
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              # Sized for the queue, not the process. BullMQ keeps one hash
              # per queued job, and this library is 1.35M assets that each
              # pass through metadataExtraction -> thumbnailGeneration ->
              # faceDetection -> duplicateDetection, so a full pass can hold
              # millions of job hashes at ~400B each across the queues.
              # OOMKilled at 256Mi, then again at 1Gi (exit 137, after ~6h).
              #
              # This matters more than a normal cache OOM: persistence is
              # deliberately off (--save "" --appendonly no), so an OOMKill
              # discards the entire queue and every job has to be rebuilt
              # from scratch -- which is what repeatedly "reset" scan
              # progress. Node has 63Gi and sits ~35% used, so the headroom
              # is cheap insurance against losing hours of work.
              limits:
                memory: 6Gi
    service:
      server:
        controller: server
        ports:
          main:
            port: *port
      machine-learning:
        controller: machine-learning
        ports:
          main:
            port: *mlport
      redis:
        controller: redis
        ports:
          main:
            port: *redisport
    # Three Services, so the backend is named explicitly (same reasoning as
    # jellyfin's app/autodiscovery split).
    route:
      app:
        hostnames:
          - "immich.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: server
                port: main
    persistence:
      # Immich's own generated data (thumbnails, previews, re-encoded video,
      # face crops) at its fixed in-container path -- disposable/regenerable
      # by rescanning the external library, same reasoning as photoview's
      # cache PVC. No Kopiur backup.
      upload:
        forceRename: immich-upload
        # 100Gi was sized against photoview-incoming's ~166k media rows. The
        # real figure is 1,345,028 assets -- Immich indexes far more of this
        # NFS tree than photoview did. At 1.28M generated files / 87G the
        # volume hit 91% with thumbnailing still unfinished, so this was
        # heading for a full-disk failure mid-scan. miroir is thin
        # provisioned (998g pool, ~26% used), so this reserves logical room
        # without consuming it up front.
        size: 400Gi
        storageClass: miroir-local
        accessMode: ReadWriteOnce
        advancedMounts:
          server:
            app:
              - path: /usr/src/app/upload
      # Same NFS export as photoview-incoming, read-only, mounted at the same
      # path -- registered as an Immich External Library (import path
      # /mnt/photos) post-deploy via the UI, not git-managed.
      photos:
        type: nfs
        server: "10.0.0.2"
        path: "/mnt/Backup/private/WD_15_backup/Seagate/Incomming/"
        advancedMounts:
          server:
            app:
              - path: /mnt/photos
                readOnly: true
      # Downloaded ONNX face-detection/CLIP models -- keep across restarts so
      # they aren't re-fetched every time the pod restarts.
      ml-cache:
        forceRename: immich-ml-cache
        size: 10Gi
        storageClass: miroir-local
        accessMode: ReadWriteOnce
        advancedMounts:
          machine-learning:
            app:
              - path: /cache
      redis-data:
        type: emptyDir
        advancedMounts:
          redis:
            app:
              - path: /data
