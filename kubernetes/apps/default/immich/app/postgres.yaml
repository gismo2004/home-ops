---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# Fresh CNPG Cluster -- no bootstrap.recovery, there is no prior Immich data to
# migrate (this is a from-scratch trial deployment against the same NFS
# library photoview-incoming already serves).
#
# imageName is NOT the standard ghcr.io/cloudnative-pg/postgresql used by every
# other app here. Immich's own ghcr.io/immich-app/postgres image bundles the
# VectorChord extension but is a plain Postgres image, not built for CNPG's
# operator contract -- it does not work as a CNPG operand image. TensorChord
# publishes a CNPG-compatible operand image with VectorChord built in
# (ghcr.io/tensorchord/cloudnative-vectorchord) specifically for this.
# Immich validates the extension version at startup (VECTORCHORD_VERSION_RANGE
# '>=0.3 <2' as of server v3.1.0) and refuses to start on a mismatch -- keep
# the tag here in step with whatever immich-server release is pinned in
# helmrelease.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
spec:
  instances: 1
  monitoring:
    enablePodMonitor: true
  # Single-instance cluster: the default primary PDB (minAvailable: 1) would
  # be permanently unsatisfiable and block `kubectl drain` during a Talos node
  # upgrade for no benefit, same reasoning as every other CNPG cluster here.
  enablePDB: false
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-0.4.3@sha256:acebb38ca309938bc05ce268b019c98aa718cb554dd54e4443654d9d00a0d498
  # VectorChord isn't a plain extension -- it must be loaded at server start,
  # not just CREATE EXTENSION'd. Confirmed live: without this, initdb's
  # postInitApplicationSQL below fails with "vchord must be loaded via
  # shared_preload_libraries" and the bootstrap job crash-loops.
  postgresql:
    shared_preload_libraries:
      - vchord
  primaryUpdateMethod: switchover
  enableSuperuserAccess: true
  postgresUID: 26
  postgresGID: 26
  storage:
    storageClass: miroir-local
    size: 50Gi
    resizeInUseVolumes: true
  walStorage:
    storageClass: miroir-local
    size: 20Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 4Gi
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-postgres-user
      # Runs once, with sufficient privilege, against the newly created
      # `immich` database -- the immich role itself is not a superuser and
      # cannot CREATE EXTENSION on its own. Confirmed live: Immich's own
      # first-run migration (1744910873969-InitialMigration.ts) attempts to
      # create every one of these itself and fails with "permission denied"
      # / "Must be superuser" on all but the trusted ones (pg_trgm). Its
      # CREATE EXTENSION IF NOT EXISTS calls are idempotent, so pre-creating
      # the full set here is a safe no-op for it to hit afterward.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS "unaccent";
        - CREATE EXTENSION IF NOT EXISTS "cube";
        - CREATE EXTENSION IF NOT EXISTS "earthdistance";
        - CREATE EXTENSION IF NOT EXISTS "pg_trgm";
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
# NO spec.backup / ScheduledBackup here, deliberately -- this is the one CNPG
# cluster in the repo that is NOT backed up, and that is a considered choice,
# not an oversight. Unlike hass/mealie/photoview, every row in this database
# is derived state: the assets themselves live read-only on NFS and are never
# written by Immich, so a lost database is recovered by re-adding the external
# library and rescanning. What is genuinely lost in that case is only manual
# curation (named people, albums, favourites) -- accepted, this is a trial
# instance evaluated against photoview-incoming.
#
# If this instance ever stops being a trial and accumulates curation worth
# keeping, re-add a backup block modelled on photoview/app/postgres.yaml and
# pick a NEW, never-used serverName (the s3://cnpg-gismo2004/immich prefix
# already holds one generation's archive from when this was enabled; reusing
# immich-postgres-v1 would fail barman-cloud-check-wal-archive's "Expected
# empty archive" pre-flight). The immich-postgres-s3-creds Secret is left in
# place for exactly that, and is simply unused for now.
