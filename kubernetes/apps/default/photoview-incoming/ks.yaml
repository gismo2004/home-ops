---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: photoview-incoming
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: photoview-incoming
      namespace: photoview-incoming
  interval: 1h
  path: ./kubernetes/apps/default/photoview-incoming/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: photoview-incoming
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      KOPIUR_NAME: photoview-incoming
      KOPIUR_CLAIM: photoview-incoming-config
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_ONMISSING: Continue
