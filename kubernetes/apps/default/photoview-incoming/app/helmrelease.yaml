# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: photoview-incoming
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: photoview-incoming
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      photoview-incoming:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          wait-for-db:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: "16.15"
            command:
              - /bin/sh
              - -c
              - until pg_isready -U photoview -d photoview -h photoview-incoming-postgres-rw; do sleep 5; done
        containers:
          app:
            image:
              repository: docker.io/viktorstrate/photoview
              tag: 2.4.0@sha256:f914c44b202fc8175e09bd56f35bb1a4a7c04dc451652306f240aabc3eea133e
            envFrom:
              - secretRef:
                  name: photoview-incoming-secrets
            env:
              MAPBOX_TOKEN: ""
              PHOTOVIEW_DATABASE_DRIVER: postgres
              PHOTOVIEW_DISABLE_FACE_RECOGNITION: "false"
              PHOTOVIEW_DISABLE_RAW_PROCESSING: "false"
              # Unlike the main photoview instance, this library's legacy .wmv
              # videos (e.g. Videos/M_plus_M/5lin02.wmv) repeatedly trigger a
              # still-unresolved upstream Go nil-pointer panic in the video
              # scanner (photoview/photoview#626, #239, #781), which segfaults
              # the whole pod mid-scan -- not just that file. That crash-loop
              # was why the scan never ran to completion and face recognition
              # never caught up on the bulk of the 165k+ photo backlog.
              PHOTOVIEW_DISABLE_VIDEO_ENCODING: "true"
              PHOTOVIEW_LISTEN_IP: 127.0.0.1
              PHOTOVIEW_LISTEN_PORT: &port 10159
              PHOTOVIEW_MEDIA_CACHE: /cache
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 10000m
                memory: 16Gi
    service:
      app:
        controller: photoview-incoming
        ports:
          main:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      cache:
        forceRename: photoview-incoming-cache
        size: 100Gi
        storageClass: miroir-local
        accessMode: ReadWriteOnce
      photos:
        type: nfs
        server: "10.0.0.2"
        path: "/mnt/Backup/private/WD_15_backup/Seagate/Incomming/"
        globalMounts:
          - path: /mnt/photos
            readOnly: true
      devshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        globalMounts:
          - path: /dev/shm
      shared:
        type: emptyDir
        globalMounts:
          - path: /shared
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        globalMounts:
          - path: /tmp
      varlogs:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        globalMounts:
          - path: /var/logs
      varrun:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        globalMounts:
          - path: /var/run
