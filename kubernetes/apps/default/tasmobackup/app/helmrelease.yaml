# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tasmobackup
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tasmobackup
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "80"
    controllers:
      tasmobackup:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/danmed/tasmobackupv1
              tag: 1.08.00@sha256:7f9efb47d49d8edb3e564badcdfecd2eea997a55ae01c77ea583dd8c407768ae
            env:
              DBNAME: data/tasmobackup
              DBTYPE: sqlite
              PUID: "568"
              PGID: "568"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - NET_BIND_SERVICE
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
    service:
      app:
        controller: tasmobackup
        ports:
          http:
            port: 8259
            targetPort: 80
    # Single Service, so app-template 5.x auto-detects the backendRef.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: tasmobackup-data
        globalMounts:
          - path: /var/www/html/data
