---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tasmobackup
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tasmobackup
      namespace: tasmobackup
  interval: 1h
  path: ./kubernetes/apps/default/tasmobackup/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tasmobackup
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      KOPIUR_NAME: tasmobackup
      KOPIUR_CLAIM: tasmobackup-data
      KOPIUR_CAPACITY: 10Gi
