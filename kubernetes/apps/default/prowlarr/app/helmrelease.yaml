# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: prowlarr
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      prowlarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.6.3.5592@sha256:8c9ee448bb6de0e3e8b9c2f536b7a3455ec6ff5e184c2fb2a8602791b2757442
            env:
              # Pre-emptive: this core does not have the TrustedNetworks key yet,
              # but the Servarr release that adds it (CVE-2026-30975 hardening)
              # is fail-closed -- any request carrying X-Forwarded-For loses the
              # DisabledForLocalAddresses exemption unless the proxy is trusted.
              # Sonarr hit exactly this on an unattended 4.0.19.3007 bump. See
              # sonarr/app/helmrelease.yaml. 172.16.0.0/24 is the pod CIDR, where
              # envoy-internal lives. Do not remove as an "unused" env var.
              PROWLARR__SERVER__TRUSTEDNETWORKS: 172.16.0.0/24
              # Empty is a no-op: it falls through to config.xml's
              # AuthenticationMethod. It does NOT disable auth.
              PROWLARR__AUTH__METHOD: ""
              PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
              PROWLARR__SERVER__PORT: &port 9696

            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
    service:
      app:
        controller: prowlarr
        ports:
          main:
            port: *port
            targetPort: *port
    # Exactly one enabled Service, so app-template 5.x auto-detects the
    # backendRef and no explicit rules: block is needed.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: prowlarr-config
      backup:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/container_share/backups
        globalMounts:
          - path: /config/Backups
