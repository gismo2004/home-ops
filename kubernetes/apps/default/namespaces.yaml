apiVersion: v1
kind: Namespace
metadata:
  name: esphome
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # esphome runs fully as root and writes build artifacts 0600 root-owned,
    # so its mover must be root too. Gated by this annotation.
    kopiur.home-operations.com/privileged-movers: "true"
---
apiVersion: v1
kind: Namespace
metadata:
