---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# Bare, non-Helm-templated CNPG Cluster.
#
# barman-cloud identifies backups by the "serverName" string inside the S3
# path, not by the k8s object's name -- so this brand-new Cluster object
# can still recover the OLD cluster's full backup history by referencing
# its serverName ("photoview-cnpg-main") in externalClusters. Recovers to
# the latest available WAL (no explicit recoveryTarget = PITR to "now").
#
# spec.backup deliberately uses a DIFFERENT serverName ("photoview-postgres")
# than the recovery source, same destinationPath (barman-cloud namespaces
# by serverName under it, so this is a sibling prefix, no collision).
# Reusing the old serverName here fails outright on recovery: CNPG's own
# restore job runs barman-cloud-check-wal-archive against ITS OWN
# spec.backup destination before recovering, and refuses with "Expected
# empty archive" if that destination already has WAL history (confirmed
# on mealie's identical migration) -- it's a guard against two different
# cluster timelines writing into the same catalog. The old serverName's
# archive is only ever read (via externalClusters), never written to
# again; all future backups land under the new serverName.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: photoview-postgres
spec:
  instances: 1
  # Exposes the Postgres metrics endpoint and creates a PodMonitor for it.
  # Off by default, which is why these three clusters produced no metrics
  # at all and the CNPG dashboard would have stayed empty.
  monitoring:
    enablePodMonitor: true
  # Single-instance cluster, so a PodDisruptionBudget can only ever be
  # unsatisfiable: CNPG's default primary PDB uses minAvailable: 1, which
  # with one pod yields disruptionsAllowed: 0 and makes `kubectl drain`
  # block forever -- i.e. it would stall a Talos node upgrade.
  # Draining this single-node cluster takes postgres down regardless, so
  # the budget protects nothing.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15@sha256:34cd4159d07b3410a1b29da35072e2e927a0905e717a61afa3814624a2e8859a
  primaryUpdateMethod: switchover
  enableSuperuserAccess: true
  postgresUID: 26
  postgresGID: 26
  storage:
    storageClass: miroir-local
    size: 20Gi
    resizeInUseVolumes: true
  walStorage:
    storageClass: miroir-local
    size: 20Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 75m
      memory: 256Mi
    limits:
      cpu: 10000m
      memory: 16Gi
  bootstrap:
    recovery:
      database: photoview
      owner: photoview
      secret:
        name: photoview-postgres-user
      source: photoview-postgres-old
  externalClusters:
    # Reads from the LIVE bucket. Repointed when the old per-app buckets were
    # deleted; kept rather than dropped because removing bootstrap.recovery
    # makes CNPG fall back to initdb, so a rebuild-from-git would come up with
    # an EMPTY database instead of failing loudly.
    #
    # On a rebuild, spec.backup.serverName below MUST be bumped so it differs
    # from the serverName read here, or barman-cloud-check-wal-archive refuses
    # with "Expected empty archive".
    - name: photoview-postgres-old
      barmanObjectStore:
        destinationPath: s3://cnpg-gismo2004/photoview
        endpointURL: https://s3.eu-central-003.backblazeb2.com
        serverName: photoview-postgres-v4
        s3Credentials:
          accessKeyId:
            name: photoview-postgres-s3-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: photoview-postgres-s3-creds
            key: ACCESS_SECRET_KEY
  backup:
    retentionPolicy: 5d
    barmanObjectStore:
      # Dedicated bucket. The old per-app buckets had accumulated one archive
      # per migration attempt -- six serverName generations in hass totalling
      # 29GB, of which the live one was 60MB -- and were deleted once a base
      # backup existed here.
      destinationPath: s3://cnpg-gismo2004/photoview
      endpointURL: https://s3.eu-central-003.backblazeb2.com
      serverName: photoview-postgres-v4
      # gzip, not bzip2. Measured on this node/link: the B2 upload tops out at
      # 3.4 MB/s while bzip2 compresses at only 5.7 MB/s -- so bzip2 pegged a
      # full core just to feed a link it could barely keep ahead of. gzip runs at
      # 22.8 MB/s for a ratio only 4 points worse (70% vs 66%), i.e. ~16s more
      # upload per GB for roughly a quarter of the CPU. lz4/snappy are faster
      # still but compress worse, and since the link is the ceiling that is a
      # net loss. CNPG's enum offers no zstd.
      data:
        compression: gzip
        jobs: 2
      wal:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: photoview-postgres-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: photoview-postgres-s3-creds
          key: ACCESS_SECRET_KEY

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: photoview-postgres-daily
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: photoview-postgres
  method: barmanObjectStore
  immediate: true
