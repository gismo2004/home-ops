# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: photoview
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: photoview
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      photoview:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          wait-for-db:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: "16.15"
            command:
              - /bin/sh
              - -c
              - until pg_isready -U photoview -d photoview -h photoview-postgres-rw; do sleep 5; done
        containers:
          app:
            image:
              repository: docker.io/viktorstrate/photoview
              tag: 2.4.0@sha256:f914c44b202fc8175e09bd56f35bb1a4a7c04dc451652306f240aabc3eea133e
            envFrom:
              - secretRef:
                  name: photoview-secrets
            env:
              MAPBOX_TOKEN: ""
              PHOTOVIEW_DATABASE_DRIVER: postgres
              PHOTOVIEW_DISABLE_FACE_RECOGNITION: "false"
              PHOTOVIEW_DISABLE_RAW_PROCESSING: "false"
              PHOTOVIEW_DISABLE_VIDEO_ENCODING: "false"
              PHOTOVIEW_LISTEN_IP: 127.0.0.1
              PHOTOVIEW_LISTEN_PORT: &port 10159
              PHOTOVIEW_MEDIA_CACHE: /cache
            probes:
              liveness:
                type: HTTP
                path: /
                port: *port
              readiness:
                type: HTTP
                path: /
                port: *port
              startup:
                type: HTTP
                path: /
                port: *port
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 10000m
                memory: 16Gi
    service:
      app:
        controller: photoview
        ports:
          main:
            port: *port
    # Exactly one enabled Service, so app-template 5.x auto-detects the
    # backendRef and no explicit rules: block is needed.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # Pure thumbnail/media cache (confirmed via `du`/`find`: 438MiB of
      # numbered subdirs keyed by photo ID), fully regenerated by
      # rescanning the library -- same disposable-cache pattern as
      # lidarr/radarr's "covers" PVC. Plain Helm-managed dynamic PVC, no
      # Kopiur SnapshotPolicy/Restore at all.
      cache:
        # See lidarr: app-template 5.x drops the "-<identifier>" suffix when
        # an app has exactly one dynamic PVC, which renamed this to
        # "photoview" and provisioned a fresh empty 100Gi volume. Worth
        # pinning rather than accepting: regenerating this cache means a full
        # library rescan, unlike the arr-suite's cover art.
        forceRename: photoview-cache
        size: 100Gi
        storageClass: miroir-local
        accessMode: ReadWriteOnce
      photos:
        type: nfs
        server: "10.0.0.2"
        path: "/mnt/Storage1/photos"
        globalMounts:
          - path: /mnt/photos
            readOnly: true
      devshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        globalMounts:
          - path: /dev/shm
      shared:
        type: emptyDir
        globalMounts:
          - path: /shared
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        globalMounts:
          - path: /tmp
      varlogs:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        globalMounts:
          - path: /var/logs
      varrun:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        globalMounts:
          - path: /var/run
