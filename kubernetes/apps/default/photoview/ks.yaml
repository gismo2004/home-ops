---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: photoview
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: photoview
      namespace: photoview
  interval: 1h
  path: ./kubernetes/apps/default/photoview/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: photoview
  wait: false
  # Backs up the SQLite database (users, albums, named face groups). The
  # photos are read-only NFS and the cache PVC is a regenerable thumbnail
  # store, so neither is backed up.
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      KOPIUR_NAME: photoview
      KOPIUR_CLAIM: photoview-data
      KOPIUR_CAPACITY: 5Gi
      # Continue only for the very first creation (no snapshot exists yet);
      # switch to Fail once the first snapshot is there.
      KOPIUR_ONMISSING: Continue
