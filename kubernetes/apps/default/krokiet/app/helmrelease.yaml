---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: krokiet
spec:
  chartRef:
    kind: OCIRepository
    name: krokiet
  interval: 1h
  values:
    controllers:
      krokiet:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jlesage/krokiet
              tag: latest@sha256:13358d9ddab7fa0b44ff033a09931734fed662e4974188e35ae969eba4109f4d
            env:
              USER_ID: 568
              GROUP_ID: 568
              KEEP_APP_RUNNING: "1"
              # 545 = builtin_users, 1001 = a_user. Required to read the Incomming
              # NFS export: most of that tree is a_user:builtin_users or
              # a_user:a_user with mode 770/660 -- no `other` bits -- so uid 568
              # was denied on ~360k files, which Krokiet's scan reported as
              # "Permission denied (os error 13)".
              #
              # This env var, NOT defaultPodOptions.supplementalGroups, is what
              # actually fixes it. The kubelet does apply supplementalGroups, but
              # only to PID 1 (root); jlesage's s6 supervisor then drops to uid 568
              # and rebuilds the supplementary list from the image's own
              # /etc/group, where `app` is only in group 568 -- so 545/1001 are
              # discarded before Krokiet ever starts. Confirmed via /proc: PID 1
              # had "Groups: 0 545 568 1001" while /usr/bin/krokiet had "Groups:
              # 568". SUP_GROUP_IDS is consumed by /etc/cont-init.d/10-init-users.sh
              # and written to /etc/services.d/app/sgid, so it survives the drop.
              SUP_GROUP_IDS: "545,1001"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5800
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5800
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5800
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              # Restored verbatim from the working TrueCharts-era release.
              # Trimming this is what broke the app: dropping privileged (and
              # separately allowPrivilegeEscalation) makes jlesage's supervisor
              # fail to start dbus -- "terminated before being ready" -- which
              # tears down every downstream service, so nothing listens on 5800
              # and the Gateway returns 503 while the Service still shows a
              # healthy endpoint. Any future trim here must be verified by
              # curling the route, not by the pod reaching 1/1 Running.
              privileged: true
              allowPrivilegeEscalation: true
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                memory: 16Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # 545/1001 here cover root-level helpers inside the container (and any
        # non-s6 process). They do NOT reach Krokiet itself -- see the
        # SUP_GROUP_IDS comment on the container env above, which is the setting
        # that actually grants the app access to the Incomming NFS export.
        #
        # Why the group route at all, rather than chown/chmod -R over the share:
        # Backup/private has aclmode=discard plus live POSIX ACLs (and the
        # tempDrive SMB share sits on it), so a recursive chmod would silently
        # drop those ACLs -- and the pool has ~56 MB free, so rewriting metadata
        # for ~1M objects while 14 snapshots pin the old copies would hit ENOSPC
        # partway and leave permissions half-applied.
        #
        # The NFS export sets no mapall and the server has manage-gids disabled
        # (/etc/nfs.conf manage-gids=n, nfs.config userd_manage_gids=false), so
        # AUTH_SYS carries the client's gid list and the server honours it.
        supplementalGroups: [568, 545, 1001]
    service:
      app:
        ports:
          http:
            port: 5800
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: krokiet-config
      photos:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/photos
        globalMounts:
          - path: /mnt/photos
      incomming:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Backup/private/WD_15_backup/Seagate/Incomming/
        globalMounts:
          - path: /mnt/incomming
