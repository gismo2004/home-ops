---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: krokiet
spec:
  chartRef:
    kind: OCIRepository
    name: krokiet
  interval: 1h
  values:
    controllers:
      krokiet:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jlesage/krokiet
              tag: latest@sha256:13358d9ddab7fa0b44ff033a09931734fed662e4974188e35ae969eba4109f4d
            env:
              USER_ID: 568
              GROUP_ID: 568
              KEEP_APP_RUNNING: "1"
            probes:
              liveness:
                type: HTTP
                path: /
                port: 5800
              readiness:
                type: HTTP
                path: /
                port: 5800
            securityContext:
              # Restored verbatim from the working TrueCharts-era release.
              # Trimming this is what broke the app: dropping privileged (and
              # separately allowPrivilegeEscalation) makes jlesage's supervisor
              # fail to start dbus -- "terminated before being ready" -- which
              # tears down every downstream service, so nothing listens on 5800
              # and the Gateway returns 503 while the Service still shows a
              # healthy endpoint. Any future trim here must be verified by
              # curling the route, not by the pod reaching 1/1 Running.
              privileged: true
              allowPrivilegeEscalation: true
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                memory: 16Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # 568 = apps. 545 = builtin_users, 1001 = a_user -- both needed to read
        # the Incomming NFS export: most of that tree is owned a_user:builtin_users
        # or a_user:a_user with mode 770/660, i.e. no `other` bits at all, so uid
        # 568 was denied on ~360k files and Krokiet's scan reported them as
        # "Permission denied (os error 13)".
        #
        # This replaces the obvious fix of chown/chmod -R over the share, which is
        # NOT safe here: Backup/private has aclmode=discard plus live POSIX ACLs
        # (and the tempDrive SMB share sits on it), so a recursive chmod would
        # silently drop those ACLs -- and the pool has ~56 MB free, so rewriting
        # metadata for ~1M objects while 14 snapshots pin the old copies would
        # hit ENOSPC partway and leave permissions half-applied.
        #
        # The NFS export sets no mapall, and the server has manage-gids disabled
        # (/etc/nfs.conf manage-gids=n, nfs.config userd_manage_gids=false), so
        # AUTH_SYS carries this gid list from the client and the server honours it.
        # Verified: reading a 770 a_user:builtin_users file as uid 568 goes from
        # EACCES to a valid JPEG once 545 is present.
        supplementalGroups: [568, 545, 1001]
    service:
      app:
        ports:
          http:
            port: 5800
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: krokiet-config
      photos:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/photos
        globalMounts:
          - path: /mnt/photos
      incomming:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Backup/private/WD_15_backup/Seagate/Incomming/
        globalMounts:
          - path: /mnt/incomming
