---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo
spec:
  chartRef:
    kind: OCIRepository
    name: echo
  interval: 1h
  values:
    replicaCount: 1
    config:
      kubernetes: true
      trustedProxies:
        - "172.16.0.0/16"
    httpRoute:
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.gismo2004.cc"
      parentRefs:
        # cluster-template ships echo on envoy-external as a canary for the
        # public path. Nothing depends on it here -- the GitHub webhook is its
        # own route (flux-webhook.gismo2004.cc, flux-system/flux-instance), and
        # no gatus check or manifest references echo -- so it does not need to
        # be internet-facing. It reflects pod/namespace/node metadata back
        # (config.kubernetes: true), which is not worth publishing for a test
        # app. jellyfin and home-assistant remain on envoy-external if the
        # external path ever needs verifying.
        - name: envoy-internal
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
