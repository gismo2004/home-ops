---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo
spec:
  chartRef:
    kind: OCIRepository
    name: echo
  interval: 1h
  values:
    replicaCount: 1
    config:
      kubernetes: true
      trustedProxies:
        - "172.16.0.0/16"
    httpRoute:
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.gismo2004.cc"
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
