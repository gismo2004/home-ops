# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oscam
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: oscam
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      oscam:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/oscam
              tag: 11966-ls21@sha256:ed2061b4092955326bc5b8e27d47efc15b25df30cffaf156ab8e5a5c530b6153
            env:
              PUID: "568"
              PGID: "568"
            # These were written in app-template 3.x syntax (type/path/port) which
            # 5.x ignores without error -- the live pod had no probes at all, so
            # oscam sat dead for six days while the pod reported 2/2 Ready.
            # tcpSocket rather than httpGet on purpose: oscam.conf's `httpallowed`
            # filters the webif by source address, and kubelet probes come from the
            # node, so an HTTP probe could fail on the ACL rather than on liveness.
            # Listening on 8888 is exactly the signal we want.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8888
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8888
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8888
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              privileged: true
              allowPrivilegeEscalation: true
              runAsUser: 0
              runAsGroup: 20
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
          codeserver:
            image:
              repository: ghcr.io/linuxserver/code-server
              tag: 4.135.0@sha256:973c87625ae2509d184de32e0eaf366c5593817bd512cfcc4f3b72091fea88e3
            env:
              PUID: "568"
              PGID: "568"
              TZ: Europe/Vienna
              DEFAULT_WORKSPACE: /
              PORT: "12321"
            securityContext:
              privileged: true
              allowPrivilegeEscalation: true
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
    service:
      app:
        controller: oscam
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.0.0.211"
          lbipam.cilium.io/sharing-key: oscam
        ports:
          main:
            port: 10062
            targetPort: 8888
          cccam:
            port: 24101
            protocol: TCP
            targetPort: 24101
          camd:
            port: 24104
            protocol: TCP
            targetPort: 24104
      codeserver:
        controller: oscam
        ports:
          http:
            port: 12321
            targetPort: 12321
    # Two Services (app + codeserver), so 5.x auto-detection does not apply
    # and each route names its backend explicitly.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: main
      codeserver:
        hostnames:
          - "oscamcs.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: codeserver
                port: http
    # `globalMounts` mounts into EVERY container. Both images here are
    # LinuxServer s6-overlay builds, and s6-rc writes its service directories to
    # /run/s6-rc -- i.e. /var/run. Sharing that emptyDir made the two s6
    # instances clobber each other: code-server won, oscam's svc-oscam and
    # svc-pcsd servicedirs were wiped, and oscam never started (broken from
    # 2026-08-23 until 2026-08-29). It is a race, so it "worked" at first.
    # Everything except the config PVC is therefore scoped to the app container
    # via advancedMounts. code-server has readOnlyRootFilesystem: false and needs
    # none of it -- least of all the /dev/ttyUSB0 card reader.
    persistence:
      config:
        existingClaim: oscam-config
      devshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2400Mi
        advancedMounts:
          oscam:
            app:
              - path: /dev/shm
      shared:
        type: emptyDir
        advancedMounts:
          oscam:
            app:
              - path: /shared
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 2400Mi
        advancedMounts:
          oscam:
            app:
              - path: /tmp
      varlogs:
        type: emptyDir
        medium: Memory
        sizeLimit: 2400Mi
        advancedMounts:
          oscam:
            app:
              - path: /var/logs
      varrun:
        type: emptyDir
        medium: Memory
        sizeLimit: 2400Mi
        advancedMounts:
          oscam:
            app:
              - path: /var/run
      usb:
        type: hostPath
        hostPath: /dev/ttyUSB-oscam
        advancedMounts:
          oscam:
            app:
              - path: /dev/ttyUSB0
