---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookshelf
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: bookshelf
      namespace: bookshelf
  interval: 1h
  path: ./kubernetes/apps/default/bookshelf/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: bookshelf
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # Identity bookshelf-config@bookshelf:/pvc/bookshelf-config. Holds config.xml
      # and the SQLite database (/config); the books go to calibre-web.
      KOPIUR_NAME: bookshelf-config
      KOPIUR_CLAIM: bookshelf-config
      KOPIUR_CAPACITY: 5Gi
      # New app: no snapshot exists yet. Switch to Fail once the first backup ran.
      KOPIUR_ONMISSING: Continue
