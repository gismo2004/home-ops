# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orcaslicer
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: orcaslicer
  values:
    defaultPodOptions:
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
          - 107
          - 568
    controllers:
      orcaslicer:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/orcaslicer
              tag: 2.4.2@sha256:b6b97945debcfb9c63dcb9b40a772c46ebedf5c3b15594d2369e9d2b317b8ac9
            env:
              PIXELFLUX_WAYLAND: "false"
              # OpenGL in software (Mesa llvmpipe), not NVIDIA GLX over DRI3:
              # that path needs NVIDIA GBM buffers, whose allocation fails here
              # (even privileged), so the 3D view and preview never draw.
              # Stream encoding still uses NVENC.
              DISABLE_DRI3: "true"
              SELKIES_UI_TITLE: OrcaSlicer
              PUID: "568"
              PGID: "568"
            # Not privileged: the GPU (and its /dev/dri nodes) comes from the
            # nvidia runtime and device plugin. The s6 init and the Selkies
            # desktop get the runtime's default capabilities; the image's
            # optional docker-in-docker stays off without privileged.
            securityContext:
              allowPrivilegeEscalation: true
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 12000m
                memory: 2400Mi
                nvidia.com/gpu: 1
    service:
      app:
        controller: orcaslicer
        ports:
          http:
            port: &port 3000
            targetPort: *port
    # Exactly one enabled Service, so app-template 5.x auto-detects the
    # backendRef and no explicit rules: block is needed.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: orcaslicer-config
      printdata:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/container_share/printer
        globalMounts:
          - path: /config/data
