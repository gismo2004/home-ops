---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orcaslicer
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: orcaslicer
      namespace: orcaslicer
  interval: 1h
  path: ./kubernetes/apps/default/orcaslicer/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: orcaslicer
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      KOPIUR_NAME: orcaslicer
      KOPIUR_CLAIM: orcaslicer-config
      KOPIUR_CAPACITY: 10Gi
