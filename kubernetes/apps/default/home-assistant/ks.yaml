---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: home-assistant
      namespace: hass
  dependsOn:
    - name: multus-networks
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/default/home-assistant/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: hass
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # Identity home-assistant@hass:/pvc/home-assistant-config, unchanged.
      # The config's database is CNPG (postgres.yaml), not part of this backup.
      KOPIUR_NAME: home-assistant
      KOPIUR_CLAIM: home-assistant-config
      KOPIUR_CAPACITY: 100Gi
      # Fail, never Continue: on an empty /config Home Assistant initialises a
      # FRESH instance, losing every account and integration with no error.
      KOPIUR_ONMISSING: Fail
