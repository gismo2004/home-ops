---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# Bare CNPG Cluster recovering Home Assistant's recorder database.
#
# The object name is kept EXACTLY as the old cluster had it. That is not
# cosmetic: HA's recorder db_url -- host, user, password and all -- is
# hardcoded in /config/configuration.yaml, which lives on the restored PVC.
# Keeping the name keeps the -rw Service at home-assistant-postgres-rw, so
# that line stays valid and no user data has to be edited. The old password is
# reused for the same reason.
#
# The archiving serverName (spec.plugins parameters) MUST differ from the
# externalClusters source, or CNPG's barman-cloud-check-wal-archive
# pre-flight refuses with "Expected empty archive".
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-postgres
spec:
  instances: 1
  # Exposes the Postgres metrics endpoint and creates a PodMonitor for it.
  # Off by default, which is why these three clusters produced no metrics
  # at all and the CNPG dashboard would have stayed empty.
  monitoring:
    enablePodMonitor: true
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15@sha256:34cd4159d07b3410a1b29da35072e2e927a0905e717a61afa3814624a2e8859a
  primaryUpdateMethod: switchover
  enableSuperuserAccess: true
  postgresUID: 26
  postgresGID: 26
  storage:
    storageClass: miroir-local
    size: 50Gi
    resizeInUseVolumes: true
  walStorage:
    storageClass: miroir-local
    size: 20Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 75m
      memory: 512Mi
    limits:
      memory: 2400Mi
  bootstrap:
    recovery:
      database: home-assistant
      owner: home-assistant
      secret:
        name: home-assistant-postgres-user
      source: home-assistant-postgres-old
  externalClusters:
    # Reads from the LIVE bucket. Repointed when the old per-app buckets were
    # deleted; kept rather than dropped because removing bootstrap.recovery
    # makes CNPG fall back to initdb, so a rebuild-from-git would come up with
    # an EMPTY database instead of failing loudly.
    #
    # On a rebuild, the archiving serverName in spec.plugins below MUST be
    # bumped so it differs from the serverName read here, or
    # barman-cloud-check-wal-archive refuses with "Expected empty archive".
    - name: home-assistant-postgres-old
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: home-assistant-backup
          serverName: home-assistant-postgres-v5
  # WAL archiving and base backups through the Barman Cloud plugin (the
  # in-tree spec.backup.barmanObjectStore is removed in CNPG 1.31). The
  # bucket settings live in the ObjectStore below; serverName stays a plugin
  # parameter and is unchanged, so the existing archive simply continues.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: home-assistant-backup
        serverName: home-assistant-postgres-v5
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: home-assistant-backup
spec:
  retentionPolicy: 5d
  configuration:
    # Dedicated bucket. The old per-app buckets had accumulated one archive
    # per migration attempt -- six serverName generations in hass totalling
    # 29GB, of which the live one was 60MB -- and were deleted once a base
    # backup existed here. No serverName here: the plugin requires it empty
    # and takes it from the Cluster's plugin parameters instead.
    destinationPath: s3://cnpg-gismo2004/home-assistant
    endpointURL: https://s3.eu-central-003.backblazeb2.com
    # gzip, not bzip2: see mealie/app/postgres.yaml for the measurements.
    data:
      compression: gzip
      jobs: 2
    wal:
      compression: gzip
    s3Credentials:
      accessKeyId:
        name: home-assistant-postgres-s3-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: home-assistant-postgres-s3-creds
        key: ACCESS_SECRET_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: home-assistant-postgres-daily
spec:
  schedule: "0 0 0 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: home-assistant-postgres
