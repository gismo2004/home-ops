---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# Bare CNPG Cluster recovering Home Assistant's recorder database.
#
# The object name is kept EXACTLY as the old cluster had it. That is not
# cosmetic: HA's recorder db_url -- host, user, password and all -- is
# hardcoded in /config/configuration.yaml, which lives on the restored PVC.
# Keeping the name keeps the -rw Service at home-assistant-postgres-rw, so
# that line stays valid and no user data has to be edited. The old password is
# reused for the same reason.
#
# spec.backup.serverName MUST differ from the externalClusters source, or
# CNPG's barman-cloud-check-wal-archive pre-flight refuses with "Expected
# empty archive".
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-postgres
spec:
  instances: 1
  # Exposes the Postgres metrics endpoint and creates a PodMonitor for it.
  # Off by default, which is why these three clusters produced no metrics
  # at all and the CNPG dashboard would have stayed empty.
  monitoring:
    enablePodMonitor: true
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16.14@sha256:93d0456be6e8e7a5d2d4e54953967f8b2d7f410c5ab7ca1739f42383436df035
  primaryUpdateMethod: switchover
  enableSuperuserAccess: true
  postgresUID: 26
  postgresGID: 26
  storage:
    storageClass: miroir-local
    size: 50Gi
    resizeInUseVolumes: true
  walStorage:
    storageClass: miroir-local
    size: 20Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 75m
      memory: 200Mi
    limits:
      memory: 2400Mi
  bootstrap:
    recovery:
      database: home-assistant
      owner: home-assistant
      secret:
        name: home-assistant-postgres-user
      source: home-assistant-postgres-old
  externalClusters:
    # The prefix the OLD cluster wrote to, holding its final backup.
    - name: home-assistant-postgres-old
      barmanObjectStore:
        destinationPath: s3://cnpg-gismo2004/home-assistant
        endpointURL: https://s3.eu-central-003.backblazeb2.com
        serverName: home-assistant-postgres-v5
        s3Credentials:
          accessKeyId:
            name: home-assistant-postgres-s3-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: home-assistant-postgres-s3-creds
            key: ACCESS_SECRET_KEY
  backup:
    retentionPolicy: 5d
    barmanObjectStore:
      # Moved to a dedicated bucket. The old per-app buckets had accumulated
      # six serverName generations from the migration (29GB in hass, of which
      # the live archive was 60MB). externalClusters above still points at the
      # old archive -- it is read-only and only consulted at bootstrap.
      destinationPath: s3://cnpg-gismo2004/home-assistant
      endpointURL: https://s3.eu-central-003.backblazeb2.com
      serverName: home-assistant-postgres-v5
      # gzip, not bzip2. Measured on this node/link: the B2 upload tops out at
      # 3.4 MB/s while bzip2 compresses at only 5.7 MB/s -- so bzip2 pegged a
      # full core just to feed a link it could barely keep ahead of. gzip runs at
      # 22.8 MB/s for a ratio only 4 points worse (70% vs 66%), i.e. ~16s more
      # upload per GB for roughly a quarter of the CPU. lz4/snappy are faster
      # still but compress worse, and since the link is the ceiling that is a
      # net loss. CNPG's enum offers no zstd.
      data:
        compression: gzip
        jobs: 2
      wal:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: home-assistant-postgres-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: home-assistant-postgres-s3-creds
          key: ACCESS_SECRET_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: home-assistant-postgres-daily
spec:
  schedule: "0 0 0 * * *"
  immediate: true
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: home-assistant-postgres
