---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [568]
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          wait-for-db:
            # Without this HA starts before the recorder database is
            # reachable, and its component setup is NOT retried: recorder
            # fails permanently and takes filter, logbook, history,
            # import_statistics, energy and analytics down with it until
            # someone restarts the pod. The old release had no such guard.
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: "16.15"
            command:
              - /bin/sh
              - -c
              - until pg_isready -U home-assistant -d home-assistant -h home-assistant-postgres-rw; do sleep 5; done
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.8.3@sha256:16ca445e58fa71d4f7ff287d4e9793ea690ccae932a5e200852371425cd7abb0
            env:
              TZ: Europe/Vienna
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8123
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                memory: 2400Mi
          codeserver:
            image:
              repository: ghcr.io/linuxserver/code-server
              tag: 4.134.0@sha256:212d588e21815316d6525abe8d14bb0114fc2cf0499f08e9e34a1b514b1055b9
            env:
              PUID: "568"
              PGID: "568"
              TZ: Europe/Vienna
              DEFAULT_WORKSPACE: /config
              PORT: "12321"
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                memory: 2400Mi
    service:
      app:
        controller: home-assistant
        type: LoadBalancer
        annotations:
          # 10.0.0.210, unchanged. Baked into device integrations and the
          # companion apps -- anything pointing at HA by IP depends on it.
          lbipam.cilium.io/ips: "10.0.0.210"
          lbipam.cilium.io/sharing-key: hass
        ports:
          main:
            port: *port
            targetPort: *port
      codeserver:
        controller: home-assistant
        ports:
          http:
            port: 12321
    # Two Services, so 5.x auto-detection does not apply and each route names
    # its backend. These affect hostname-based HTTP only; the LoadBalancer on
    # 10.0.0.210 is separate and unaffected.
    route:
      app:
        hostnames:
          - "homeserver.gismo2004.cc"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: main
      codeserver:
        hostnames:
          - "homeservercs.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: codeserver
                port: http
    persistence:
      config:
        existingClaim: home-assistant-config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
