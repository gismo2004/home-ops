---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: home-assistant
spec:
  compression:
    compressor: zstd
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      privileged: true
    cache:
      capacity: 2Gi
      # Ephemeral: a persistent cache keeps the ownership of whichever mover
      # identity last wrote it, breaking the next run under a different one.
      mode: Ephemeral
      storageClassName: miroir-local
  repository:
    kind: ClusterRepository
    name: default
  credentialProjection:
    enabled: true
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 2
    keepWeekly: 4
  sources:
    - pvc:
        name: home-assistant-config
  volumeSnapshotClassName: miroir-snap
