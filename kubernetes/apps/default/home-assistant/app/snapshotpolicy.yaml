---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: home-assistant
  annotations:
    # Temporary, while this moves to components/kopiur/backup.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  compression:
    compressor: zstd
  mover:
    # Home Assistant runs as 568 and owns every file under /config (the
    # root-owned .storage/auth and .storage/http of the old cluster are gone).
    # A root mover is not only unnecessary but harmful on restore: without
    # privilegedMode it writes every file as 0:65532 mode 644, which HA cannot
    # write. Verified with a scratch Restore on 2026-09-24.
    securityContext:
      runAsUser: 568
      runAsGroup: 568
    cache:
      capacity: 2Gi
      # Persistent, see components/kopiur/backup/snapshotpolicy.yaml.
      mode: Persistent
      storageClassName: miroir-local
  repository:
    kind: ClusterRepository
    name: default
  credentialProjection:
    enabled: true
  retention:
    keepLatest: 4
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: home-assistant-config
  volumeSnapshotClassName: miroir-snap
