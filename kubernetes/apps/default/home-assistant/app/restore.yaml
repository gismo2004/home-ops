---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: home-assistant-config
  annotations:
    # Temporary, while this moves to components/kopiur/backup.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  credentialProjection:
    enabled: true
  mover:
    # Files come back owned by the mover's uid, so this must be HA's own 568;
    # see the SnapshotPolicy.
    securityContext:
      runAsUser: 568
      runAsGroup: 568
  policy:
    # Fail, never Continue. An empty /config is worse than a stalled
    # migration: Home Assistant will happily initialise a FRESH instance over
    # the top, losing every account and integration with no error anywhere.
    onMissingSnapshot: Fail
  source:
    fromPolicy:
      name: home-assistant
      offset: 0
  target:
    populator: {}
