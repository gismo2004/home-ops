---
# vdf had no SnapshotSchedule at all -- its only backups were the manual
# Snapshot CRs someone created by hand. Both PVCs are now on the same daily
# cadence as every other app.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: vdf-config
  annotations:
    # Temporary, while this moves to components/kopiur/backup.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyRef:
    name: vdf-config
  schedule:
    cron: "H 0,6,12,18 * * *"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: vdf-state
  annotations:
    # Temporary, while this moves to components/kopiur/backup.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyRef:
    name: vdf-state
  schedule:
    cron: "H 0,6,12,18 * * *"
