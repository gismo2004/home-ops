---
# TWO independent single-source policies, not one policy with two sources.
# A combined policy backs up fine, but Restore.spec.source.fromPolicy
# resolves its sourcePath from the POLICY's configured source and has no way
# to disambiguate between several -- so both Restores would resolve to the
# first source and restore the wrong data into one of the PVCs (confirmed
# the hard way on mosquitto). That is what this file used to be.
#
# The mover is left unelevated: the app runs as root, but every file is
# world-readable, so there is no reason to grant this namespace the
# privileged-movers boundary. It runs as 568 explicitly, the same identity
# as the Restores, so backup and restore never disagree.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: vdf-config
spec:
  compression:
    compressor: zstd
  mover:
    securityContext: { runAsUser: 568, runAsGroup: 568 }
    cache:
      capacity: 2Gi
      # Persistent, see components/kopiur/backup/snapshotpolicy.yaml.
      mode: Persistent
      storageClassName: miroir-local
  repository:
    kind: ClusterRepository
    name: default
  credentialProjection:
    enabled: true
  retention:
    keepLatest: 4
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: vdf-app-template-config
  volumeSnapshotClassName: miroir-snap
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: vdf-state
spec:
  compression:
    compressor: zstd
  mover:
    securityContext: { runAsUser: 568, runAsGroup: 568 }
    cache:
      capacity: 2Gi
      # Persistent, see components/kopiur/backup/snapshotpolicy.yaml.
      mode: Persistent
      storageClassName: miroir-local
  repository:
    kind: ClusterRepository
    name: default
  credentialProjection:
    enabled: true
  retention:
    keepLatest: 4
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: vdf-app-template-state
  volumeSnapshotClassName: miroir-snap
