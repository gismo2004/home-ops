---
# Declared as a bare Kustomize resource, not app-template's existingClaim
# output and not Helm-templated at all, so no future Helm release can ever
# consider it part of its own release manifest and delete it on an
# uninstall/chart swap — see kubernetes/apps/tasmoadmin (helm.sh/resource-policy:
# keep did not survive that exact scenario there).
#
# dataSourceRef claims the Restore populator in restore.yaml — Kopiur fills
# this PVC from the jdownloader2 SnapshotPolicy's most recent snapshot
# before anything else can mount it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jdownloader2-config
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: jdownloader2-config
  resources:
    requests:
      storage: 10Gi
  storageClassName: miroir-local
