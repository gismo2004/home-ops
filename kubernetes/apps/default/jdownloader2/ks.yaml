---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jdownloader2
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: jdownloader2
      namespace: jdownloader2
  interval: 1h
  path: ./kubernetes/apps/default/jdownloader2/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: jdownloader2
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # Identity jdownloader2@jdownloader2:/pvc/jdownloader2-config, unchanged.
      KOPIUR_NAME: jdownloader2
      KOPIUR_CLAIM: jdownloader2-config
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_ONMISSING: Continue
