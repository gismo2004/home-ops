# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unmonitarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: unmonitarr
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      unmonitarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unmonitarr/unmonitarr
              tag: latest@sha256:9a8cc3683a633c36739189d23c66f0beef9419b2eee04a4eb16fd9eea7524d47
            args:
              - uvicorn
              - src.main:app
              - --host
              - 0.0.0.0
              - --port
              - "8088"
              - --proxy-headers
              - --forwarded-allow-ips=*
            env:
              JELLYFIN_URL: "http://jellyfin.media.svc.cluster.local:8096"
              JELLYFIN_API_KEY: "17ba6e6e5c0e4ed1a4f3f55baad37834"
              SONARR_URL: "http://sonarr.media.svc.cluster.local:8989"
              SONARR_API_KEY: "c1d00fd0de9c4b31a7de6a24745ed143"
              RADARR_URL: "http://radarr.media.svc.cluster.local:7878"
              RADARR_API_KEY: "5d60fdf14a8a48738027c122769353cf"
              ADMIN_USERNAME: "admin"
              ADMIN_PASSWORD: "Mondschein1122!!"
              AUTO_SYNC_ENABLED: "true"
              SYNC_DELAY_SECONDS: "0"
              MAX_REQUESTS_PER_MINUTE: "300"
              IGNORE_SPECIAL_EPISODES: "true"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8088
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
    service:
      app:
        controller: unmonitarr
        ports:
          main:
            port: &port 8088
            targetPort: *port
    # Single Service, so app-template 5.x auto-detects the backendRef.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: unmonitarr-config
        globalMounts:
          - path: /app/config
      data:
        existingClaim: unmonitarr-data
        globalMounts:
          - path: /app/data
      main-js:
        type: configMap
        # identifier, not name: app-template 5.x changed the generated
        # ConfigMap name from <release>-<identifier> ("unmonitarr-main-js",
        # what 3.7.3 produced and what this used to hardcode) to just
        # "unmonitarr". Referencing by identifier lets the chart resolve it
        # and survives any further naming change.
        identifier: main-js
        globalMounts:
          - path: /app/static/main.js
            subPath: main.js
            readOnly: true
    configMaps:
      # referenced by identifier from persistence.main-js above, so the
      # generated name does not matter.
      main-js:
        data:
          main.js: |2
                    // Auto-refresh functionality (deprecated - now handled by individual pages)
                    function autoRefresh() {
                        // This function is deprecated. Individual pages now handle their own refresh logic
                        // to avoid interfering with bulk sync operations and provide better user experience.
                    }

                    // API helper functions
                    async function apiRequest(url, options = {}) {
                        try {
                            const response = await fetch(url, {
                                headers: {
                                    'Content-Type': 'application/json',
                                    ...options.headers
                                },
                                ...options
                            });

                            if (!response.ok) {
                                throw new Error('HTTP error! status: ' + response.status);
                            }

                            return await response.json();
                        } catch (error) {
                            console.error('API request failed:', error);
                            throw error;
                        }
                    }

                    // Format timestamp according to user's locale
                    function formatTimestamp(isoString) {
                        if (!isoString) return 'N/A';

                        const date = new Date(isoString.endsWith('Z') ? isoString : isoString + 'Z');
                        const now = new Date();
                        const diffMs = now - date;
                        const diffHours = diffMs / (1000 * 60 * 60);
                        const diffDays = diffMs / (1000 * 60 * 60 * 24);

                        // If less than 1 hour ago, show relative time
                        if (diffHours < 1) {
                            const diffMinutes = Math.floor(diffMs / (1000 * 60));
                            if (diffMinutes < 1) return 'Just now';
                            return diffMinutes + ' minute' + (diffMinutes > 1 ? 's' : '') + ' ago';
                        }

                        // If less than 24 hours ago, show hours
                        if (diffHours < 24) {
                            const hours = Math.floor(diffHours);
                            return hours + ' hour' + (hours > 1 ? 's' : '') + ' ago';
                        }

                        // If less than 7 days ago, show days
                        if (diffDays < 7) {
                            const days = Math.floor(diffDays);
                            return days + ' day' + (days > 1 ? 's' : '') + ' ago';
                        }

                        // Otherwise show formatted date based on user's locale
                        return date.toLocaleDateString(navigator.language, {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    }

                    // Format media title based on type
                    function formatMediaTitle(mediaItem) {
                        if (!mediaItem) return 'Unknown Media';

                        const mediaType = mediaItem.media_type || mediaItem.item_type;
                        const title = mediaItem.title || mediaItem.media_title || mediaItem.item_name;

                        // For movies, just show the title
                        if (mediaType === 'movie' || mediaType === 'Movie') {
                            return title;
                        }

                        // For episodes, show: Series Name S01E01 - Episode Title
                        if (mediaType === 'episode' || mediaType === 'Episode') {
                            // Use the direct series_name field from the database
                            const seriesName = mediaItem.series_name || 'Unknown Series';
                            const seasonNum = mediaItem.season_number || mediaItem.SeasonNumber || mediaItem.ParentIndexNumber;
                            const episodeNum = mediaItem.episode_number || mediaItem.EpisodeNumber || mediaItem.IndexNumber;
                            const episodeTitle = title;

                            if (seasonNum !== null && seasonNum !== undefined && episodeNum !== null && episodeNum !== undefined) {
                                const season = String(seasonNum).padStart(2, '0');
                                const episode = String(episodeNum).padStart(2, '0');
                                return seriesName + ' S' + season + 'E' + episode + ' - ' + episodeTitle;
                            } else if (seasonNum !== null && seasonNum !== undefined) {
                                return seriesName + ' Season ' + seasonNum + ' - ' + episodeTitle;
                            } else {
                                return seriesName + ' - ' + episodeTitle;
                            }
                        }

                        // For series or seasons, show the title as is
                        return title;
                    }

                    // Initialize page
                    document.addEventListener('DOMContentLoaded', function() {
                        autoRefresh();
                    });
