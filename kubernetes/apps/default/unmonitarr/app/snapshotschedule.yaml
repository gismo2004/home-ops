---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: unmonitarr-config
  annotations:
    # Temporary, while this moves to components/kopiur/backup.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyRef:
    name: unmonitarr-config
  schedule:
    cron: "H 0,6,12,18 * * *" # every 6h, at a deterministic hashed minute
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: unmonitarr-data
  annotations:
    # Temporary, while this moves to components/kopiur/backup.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyRef:
    name: unmonitarr-data
  schedule:
    cron: "H 0,6,12,18 * * *" # every 6h, at a deterministic hashed minute
