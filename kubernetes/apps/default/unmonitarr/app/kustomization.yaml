---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: unmonitarr-webhook-handler
    files:
      - webhook_handler.py=./webhook_handler.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # ks.yaml runs postBuild substitution for the backup component; keep it
    # off the handler's source, where a `$` must stay literal.
    kustomize.toolkit.fluxcd.io/substitute: disabled
