# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: radarr
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.2.10590@sha256:01ab4edc881b117e30972482ae4362c13ca76ee73c891a7581cffe597d43ca31
            env:
              # Pre-emptive: this core does not have the TrustedNetworks key yet,
              # but the Servarr release that adds it (CVE-2026-30975 hardening)
              # is fail-closed -- any request carrying X-Forwarded-For loses the
              # DisabledForLocalAddresses exemption unless the proxy is trusted.
              # Sonarr hit exactly this on an unattended 4.0.19.3007 bump. See
              # sonarr/app/helmrelease.yaml. 172.16.0.0/24 is the pod CIDR, where
              # envoy-internal lives. Do not remove as an "unused" env var.
              RADARR__SERVER__TRUSTEDNETWORKS: 172.16.0.0/24
              # Empty is a no-op: it falls through to config.xml's
              # AuthenticationMethod. It does NOT disable auth.
              RADARR__AUTH__METHOD: ""
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__SERVER__PORT: &port 7878

            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
    service:
      app:
        controller: radarr
        ports:
          main:
            port: *port
            targetPort: *port
    # Exactly one enabled Service, so app-template 5.x auto-detects the
    # backendRef and no explicit rules: block is needed.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: radarr-config
      covers:
        # See lidarr: app-template 5.x drops the "-<identifier>" suffix when
        # an app has exactly one dynamic PVC, which renamed this to "radarr".
        # forceRename pins the existing name.
        forceRename: radarr-covers
        size: 20Gi
        storageClass: miroir-local
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /config/MediaCover
      backup:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/container_share/backups
        globalMounts:
          - path: /config/Backups
      downloads:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/download
        globalMounts:
          - path: /mnt/download
      movies:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/movies
        globalMounts:
          - path: /mnt/movies
