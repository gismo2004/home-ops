# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: radarr
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.1.10545@sha256:260469d707617f4b5be1cd11a40be7e4889c63c5e7cdbc6a429626dc05863b6b
            env:
              UMASK: "0022"

              S6_READ_ONLY_ROOT: "1"
              RADARR__AUTH__METHOD: ""
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__SERVER__PORT: &port 7878

            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
    service:
      app:
        controller: radarr
        ports:
          main:
            port: *port
            targetPort: *port
    # Exactly one enabled Service, so app-template 5.x auto-detects the
    # backendRef and no explicit rules: block is needed.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: radarr-config
      covers:
        # See lidarr: app-template 5.x drops the "-<identifier>" suffix when
        # an app has exactly one dynamic PVC, which renamed this to "radarr".
        # forceRename pins the existing name.
        forceRename: radarr-covers
        size: 20Gi
        storageClass: miroir-local
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /config/MediaCover
      backup:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/container_share/backups
        globalMounts:
          - path: /config/Backups
      downloads:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/download
        globalMounts:
          - path: /mnt/download
      movies:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/movies
        globalMounts:
          - path: /mnt/movies
