---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Maintainerr: rule-based library maintenance (Jellyfin + Radarr/Sonarr).
# Replaces unmonitarr (unmonitor after watching) and Jellyfin's Media Cleaner
# plugin (delete 30 days after watching); a Jellyfin favourite (heart) from
# any user protects an item. Rules live in its database (backed up here).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: maintainerr
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: maintainerr
      namespace: maintainerr
  interval: 1h
  path: ./kubernetes/apps/default/maintainerr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: maintainerr
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      # New app (2026-09-30): no snapshot yet, so start empty.
      KOPIUR_NAME: maintainerr-config
      KOPIUR_CLAIM: maintainerr-config
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_ONMISSING: Continue
