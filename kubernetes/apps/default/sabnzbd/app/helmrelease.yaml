# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  values:
    defaultPodOptions:
      securityContext:
        # kept at 568 (not the reference config's 1000) -- sabnzbd's
        # downloads mount is the same shared NFS path sonarr/radarr/lidarr
        # import completed downloads from, and all of those still run as
        # 568. This image doesn't hardcode uid 1000 internally (unlike
        # PUID/PGID-style images), it just runs as whatever non-root uid
        # the pod gives it, so pinning to 568 keeps the whole download
        # pipeline's ownership consistent.
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Do not swap this image back to containerforge/sabnzbd: its
            # startup VACUUM hit a `disk I/O error` on every pod (re)start
            # under readOnlyRootFilesystem: true. The fix is the writable
            # /tmp emptyDir in persistence -- SQLite's VACUUM needs a
            # writable temp location and does not resolve it the same way
            # Python's tempfile module does. Keep both together.
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3@sha256:b1795982db498ed5691a7b1231f0fac7eed2a1d53e9c81b8e834d02695e76104
            env:
              SABNZBD__PORT: &port 10097
              SABNZBD__HOST_WHITELIST_ENTRIES: ""
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 300Mi
              limits:
                cpu: 12000m
                memory: 8Gi
    service:
      app:
        controller: sabnzbd
        ports:
          main:
            port: *port
            targetPort: *port
    # Exactly one enabled Service, so app-template 5.x auto-detects the
    # backendRef and no explicit rules: block is needed.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: sabnzbd-config
      # One filesystem for downloads and media (TRaSH layout), so imports
      # are an instant rename on the NAS instead of a full copy through the
      # node: /data/usenet (SABnzbd) and /data/media/movies (Radarr). The
      # dataset was Storage1/movies, renamed to Storage1/data on 2026-09-30.
      data:
        type: nfs
        server: 10.0.0.2
        path: /mnt/Storage1/data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
      # Post-processing scripts (script_dir = /scripts in sabnzbd.ini).
      # media_check.py repairs or rejects files the CoreELEC box can't play
      # before radarr/sonarr import them; see the script's docstring.
      scripts:
        type: configMap
        name: sabnzbd-scripts
        defaultMode: 0755
        globalMounts:
          - path: /scripts
            readOnly: true
      # Static ffmpeg/ffprobe for media_check.py, mounted straight from the
      # image (Kubernetes image volume): the sabnzbd image has no ffmpeg.
      # Needs >= 7.1 for the dovi_rpu bitstream filter.
      ffmpeg:
        type: image
        image:
          repository: docker.io/mwader/static-ffmpeg
          tag: 9.0.2@sha256:7d9bdaaf887f7e6ce6151f67325c344074b5ff1fb75316011c3376503e449a7b
        globalMounts:
          - path: /opt/ffmpeg
            readOnly: true
