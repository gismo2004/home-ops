---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: sabnzbd-scripts
    files:
      - ./scripts/media_check.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # ks.yaml runs postBuild substitution for the backup component; keep it
    # off the script's source, where a `$` must stay literal.
    kustomize.toolkit.fluxcd.io/substitute: disabled
