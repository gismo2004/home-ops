# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: iceagent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: iceagent
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    controllers:
      iceagent:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/gismo2004/ice_agent
              repository: ghcr.io/gismo2004/ice_agent
              tag: v1.9.3@sha256:e8ebb8cd1af4711b1d974227cb388b7cac208656b1d1b22c193e926846d5e7b6
            probes:
              liveness:
                type: HTTP
                path: /
                port: &port 8080
              readiness:
                type: HTTP
                path: /
                port: *port
              startup:
                type: HTTP
                path: /
                port: *port
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
          codeserver:
            image:
              repository: ghcr.io/linuxserver/code-server
              tag: 4.133.0@sha256:48dab910e89899bcdca334e18c96d44b1e7798affd9325196087ef35aba4946e
            env:
              PUID: "568"
              PGID: "568"
              TZ: Europe/Vienna
              DEFAULT_WORKSPACE: /
              PORT: "12321"
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 75m
                memory: 200Mi
              limits:
                cpu: 1500m
                memory: 2400Mi
    service:
      app:
        controller: iceagent
        ports:
          main:
            port: *port
            targetPort: *port
      codeserver:
        controller: iceagent
        ports:
          http:
            port: 12321
            targetPort: 12321
    # Two Services (app + codeserver), so 5.x auto-detection does not apply
    # and each route names its backend explicitly.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: main
      codeserver:
        hostnames:
          - "iceagentcs.gismo2004.cc"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: codeserver
                port: http
    persistence:
      config:
        existingClaim: iceagent-config
        globalMounts:
          - path: /app/config
      devshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2400Mi
        globalMounts:
          - path: /dev/shm
      shared:
        type: emptyDir
        globalMounts:
          - path: /shared
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 2400Mi
        globalMounts:
          - path: /tmp
      varlogs:
        type: emptyDir
        medium: Memory
        sizeLimit: 2400Mi
        globalMounts:
          - path: /var/logs
      varrun:
        type: emptyDir
        medium: Memory
        sizeLimit: 2400Mi
        globalMounts:
          - path: /var/run
