---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iceagent
  namespace: default
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: iceagent
      namespace: iceagent
  interval: 1h
  path: ./kubernetes/apps/default/iceagent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: iceagent
  wait: false
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      KOPIUR_NAME: iceagent
      KOPIUR_CLAIM: iceagent-config
      KOPIUR_CAPACITY: 1Gi
