---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # The annotation is what makes Renovate manage this line. The talosFactory
    # preset's custom manager only scans files under talos/, so without it this
    # plan would silently stay pinned while topf.yaml moved on, and the two
    # would drift. Matches onedr0p/home-ops.
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.0
  policy:
    rebootMode: default
    placement: soft
  healthChecks:
    # Never upgrade the node while Kopiur is mid-flight: a reboot during a
    # snapshot or restore is how you get a half-written volume.
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.phase != 'Running'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])
    # miroir equivalent of onedr0p's CephCluster gate.
    - apiVersion: miroir.home-operations.com/v1alpha1
      kind: MiroirNode
      expr: |-
        status.conditions.exists(c, c.type == 'PoolUsageHigh' && c.status == 'False')
