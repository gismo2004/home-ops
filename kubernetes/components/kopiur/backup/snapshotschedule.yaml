---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${KOPIUR_NAME}
spec:
  policyRef:
    name: ${KOPIUR_NAME}
  schedule:
    cron: "${KOPIUR_CRON:=H 0,6,12,18 * * *}" # every 6h, at a deterministic hashed minute
    # NOTE: "H H/12 * * *" (Jenkins-style hash-with-step) is rejected by
    # Kopiur's admission webhook: "CronPattern contains illegal character
    # 'H' in part 'H/12'" -- H can't combine with a step. An explicit hour list
    # is fine. Confirmed working via `kubectl apply --dry-run=server` before use.
    #
    # Timezone (Europe/Vienna) and jitter (6h) are inherited directly from
    # ClusterRepository/default (spec.scheduleDefaults).
