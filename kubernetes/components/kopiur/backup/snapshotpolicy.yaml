---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${KOPIUR_NAME}
spec:
  compression:
    compressor: zstd
  mover:
    securityContext:
      # 568 is this cluster's convention; apps that differ override it.
      runAsUser: ${KOPIUR_PUID:=568}
      runAsGroup: ${KOPIUR_PGID:=568}
    cache:
      capacity: ${KOPIUR_CACHE:=2Gi}
      # Persistent: one kopiur-cache-<policy> PVC per policy, kept between
      # runs. It exists before the mover pod does, so there is no
      # FailedScheduling event while an ephemeral claim is created, and kopia
      # reuses its cache instead of rereading from B2. It keeps the ownership
      # of the identity that wrote it: after changing an app's KOPIUR_PUID,
      # delete that app's cache PVC once.
      mode: ${KOPIUR_CACHEMODE:=Persistent}
      storageClassName: ${KOPIUR_STORAGECLASS:=miroir-local}
  repository:
    kind: ClusterRepository
    name: default
  credentialProjection:
    enabled: true
  # Every run of the last day, one per day for a week, one per week for a
  # month. Every backup in the cluster comes from this component.
  retention:
    keepLatest: 4
    keepDaily: 7
    keepWeekly: 4
  sources:
    # Exactly one source per policy. A combined multi-source policy files every
    # source under sources[0]'s path, so the others are never really captured
    # and cannot be restored independently.
    - pvc:
        name: ${KOPIUR_CLAIM}
  volumeSnapshotClassName: ${KOPIUR_VSC:=miroir-snap}
