---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Secret scan of the full history with .gitleaks.toml/.gitleaksignore, the
# same rules as the pre-commit hook. It catches commits that skipped the hook
# (another machine, --no-verify, the GitHub web editor). This repo is public:
# a finding here means rotate the secret first, then move it to
# app/secret.sops.yaml.
name: "Gitleaks"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan history
        # --user: same uid as the checkout, else git refuses the repo
        # ("dubious ownership").
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --verbose .
