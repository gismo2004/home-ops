[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
JUST_UNSTABLE = "1"

[tools]
age = "1.3.2"
cloudflared = "2026.10.4"
flux2 = "2.9.6"
gh = "2.103.2"
gitleaks = "8.30.1"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "24.22.1"
oxfmt = "0.74.0"
sops = "3.13.3"
talosctl = "1.14.3"
"github:postfinance/topf" = "v0.6.2"
yq = "4.54.1"
zizmor = "1.31.1"

[hooks]
postinstall = "lefthook install"
