# gitleaks config, used by the pre-commit hook (.lefthook.toml) and CI
# (.github/workflows/gitleaks.yaml).
#
# gitleaks' default rules only find tokens with a recognisable shape. They
# missed plaintext passwords and generic 32-hex API keys in manifests, which
# is how unmonitarr's keys ended up in this public repo (2026-08-20, rotated
# 2026-09-28). The extra rule below flags any credential-looking env/value
# in YAML outside *.sops.yaml. Real secrets belong in app/secret.sops.yaml.
[extend]
useDefault = true

[[rules]]
id = "plaintext-credential-in-manifest"
description = "Credential-looking value in a manifest; move it to app/secret.sops.yaml"
regex = '''(?im)^\s*-?\s*["']?[A-Za-z0-9_]*(?:password|passwd|api_?key|token|secret)[A-Za-z0-9_]*["']?[ \t]*:[ \t]*["']?([^\s"'#]{6,})'''
secretGroup = 1
path = '''\.ya?ml$'''

[[rules.allowlists]]
description = "SOPS-encrypted files"
paths = ['''\.sops\.ya?ml$''']

[[rules.allowlists]]
description = "References and placeholders, not values"
regexTarget = "match"
regexes = [
  '''!env_var''',
  '''\$\{''',
  '''\{\{''',
  '''secretKeyRef''',
  '''(?i)(existingSecret|secretName|secretRef|tokenSecret|secretTemplate)\s*:''',
  '''(?i)ENC\[''',
  '''(?i)secretsPath[ \t]*:''',
]
